# Fast Intent Router Patterns
# High-frequency patterns for <50ms intent detection (80% of commands)
# Format: pattern → intent_type + entity extraction rules
#
# Performance Target: <50ms P95 latency
# Coverage Target: 80% of user commands
# Accuracy Target: >98% (better than Alexa 95%, Siri 94%, Google 96%)

version: "1.0.0"
last_updated: "2026-02-19"

# Pattern Syntax:
# - {entity_type} for entity placeholders
# - * for wildcard matching
# - | for alternatives
# - Patterns are case-insensitive
# - Patterns are matched in order (most specific first)

patterns:
  # Timer & Alarm Commands (15% of traffic)
  - pattern: "set timer for {duration}"
    intent: "set_timer"
    entities:
      duration: "DURATION"

  - pattern: "set {duration} timer"
    intent: "set_timer"
    entities:
      duration: "DURATION"

  - pattern: "timer for {duration}"
    intent: "set_timer"
    entities:
      duration: "DURATION"

  - pattern: "set alarm for {time}"
    intent: "set_alarm"
    entities:
      time: "TIME"

  - pattern: "wake me up at {time}"
    intent: "set_alarm"
    entities:
      time: "TIME"

  - pattern: "cancel timer"
    intent: "cancel_timer"
    entities: {}

  - pattern: "stop timer"
    intent: "cancel_timer"
    entities: {}

  - pattern: "cancel alarm"
    intent: "cancel_alarm"
    entities: {}

  # Weather Queries (12% of traffic)
  - pattern: "what's the weather"
    intent: "query_weather"
    entities: {}

  - pattern: "weather in {location}"
    intent: "query_weather"
    entities:
      location: "LOCATION"

  - pattern: "how's the weather"
    intent: "query_weather"
    entities: {}

  - pattern: "will it rain"
    intent: "query_weather"
    entities:
      condition: "rain"

  - pattern: "temperature in {location}"
    intent: "query_weather"
    entities:
      location: "LOCATION"

  # Music & Media (10% of traffic)
  - pattern: "play {song}"
