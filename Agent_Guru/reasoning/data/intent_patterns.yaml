  - pattern: "turn off {device}"
    intent: "device_off"
    entities:
      device: "DEVICE"

  - pattern: "dim {device}"
    intent: "device_dim"
    entities:
      device: "DEVICE"

  - pattern: "brighten {device}"
    intent: "device_brighten"
    entities:
      device: "DEVICE"

  # Navigation (6% of traffic)
