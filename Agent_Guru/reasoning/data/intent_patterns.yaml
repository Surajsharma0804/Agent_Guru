# Entity Extraction Rules
# Regex patterns for extracting entity values
entity_patterns:
  DURATION:
    - pattern: '(\d+)\s*(second|seconds|sec|secs|s)'
      unit: "seconds"
    - pattern: '(\d+)\s*(minute|minutes|min|mins|m)'
      unit: "minutes"
    - pattern: '(\d+)\s*(hour|hours|hr|hrs|h)'
      unit: "hours"
    - pattern: '(\d+):(\d+)'  # MM:SS format
      unit: "time_format"

  TIME:
    - pattern: '(\d{1,2}):(\d{2})\s*(am|pm|AM|PM)?'
      format: "12hour"
    - pattern: '(\d{1,2})\s*(am|pm|AM|PM)'
      format: "12hour_simple"
    - pattern: '(\d{2}):(\d{2})'
      format: "24hour"

  LOCATION:
    - pattern: '([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)'  # Capitalized words
      type: "place_name"

  PERSON:
    - pattern: '([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)'  # Capitalized words
      type: "contact_name"

  DEVICE:
    - pattern: '(light|lights|lamp|fan|tv|television|thermostat|ac|air conditioner)'
      type: "smart_device"

  APP:
    - pattern: '([a-zA-Z]+(?:\s+[a-zA-Z]+)*)'  # Any word sequence
      type: "application_name"

  SONG:
    - pattern: '(.+)'  # Capture everything
      type: "song_title"

  TASK:
    - pattern: '(.+)'  # Capture everything
      type: "task_description"

