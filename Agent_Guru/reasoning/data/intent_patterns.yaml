  - pattern: "play music"
    intent: "play_music"
    entities: {}

  - pattern: "pause music"
    intent: "pause_music"
    entities: {}

  - pattern: "stop music"
    intent: "stop_music"
    entities: {}

  - pattern: "next song"
    intent: "next_track"
    entities: {}

  - pattern: "previous song"
    intent: "previous_track"
    entities: {}

  - pattern: "volume up"
    intent: "volume_up"
    entities: {}

  - pattern: "volume down"
    intent: "volume_down"
    entities: {}

  # Messaging (8% of traffic)
  - pattern: "send message to {contact}"
    intent: "send_message"
