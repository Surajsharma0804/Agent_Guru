[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=guru_deployment
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    --hypothesis-show-statistics
    --benchmark-disable
asyncio_mode = auto
