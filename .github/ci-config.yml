# GURU Personal Assistant - CI/CD Configuration
# Centralized configuration for all CI/CD workflows
# Production-grade settings with maximum engineering approach

# ============================================================================
# GLOBAL CI/CD CONFIGURATION
# ============================================================================
global:
  # Project Information
  project_name: "GURU Personal Assistant"
  project_version: "1.0.0"
  project_description: "Production-Grade, Cross-Device Personal Automation System"
  
  # Repository Configuration
  default_branch: "main"
  development_branch: "develop"
  release_branch_pattern: "release/*"
  feature_branch_pattern: "feature/*"
  hotfix_branch_pattern: "hotfix/*"
  security_branch_pattern: "security/*"

# ============================================================================
# PLATFORM AND RUNTIME CONFIGURATION
# ============================================================================
platforms:
  # Node.js Configuration
  node:
    versions: ["18.x", "20.x"]
    default_version: "18.x"
    package_manager: "npm"
    cache_strategy: "aggressive"
    optimization:
      max_old_space_size: 4096
      enable_source_maps: false
      production_build: true
  
  # Python Configuration
  python:
    versions: ["3.11", "3.12"]
    default_version: "3.11"
    package_manager: "pip"
    cache_strategy: "aggressive"
    optimization:
      compile_bytecode: true
      optimize_level: 2
      enable_lto: true
  
  # Java/Kotlin Configuration
  java:
    version: "17"
    distribution: "temurin"
    gradle_version: "8.5"
    kotlin_version: "1.9.22"
    cache_strategy: "aggressive"
    optimization:
      parallel_builds: true
      build_cache: true
      configuration_cache: true
  
  # Operating Systems
  operating_systems:
    windows:
      runner: "windows-2022"
      shell: "pwsh"
      optimization:
        enable_long_paths: true
        disable_defender_realtime: false
    linux:
      runner: "ubuntu-22.04"
      shell: "bash"
      optimization:
        enable_ccache: true
        use_ninja_build: true
    macos:
      runner: "macos-13"
      shell: "bash"
      optimization:
        enable_xcode_cache: true

# ============================================================================
# BUILD CONFIGURATION
# ============================================================================
build:
  # Build Types
  types:
    debug:
      optimization_level: "O0"
      debug_symbols: true
      assertions: true
      profiling: true
    release:
      optimization_level: "O3"
      debug_symbols: false
      assertions: false
      profiling: false
      lto: true
    relwithdebinfo:
      optimization_level: "O2"
      debug_symbols: true
      assertions: false
      profiling: false
  
  # Parallel Execution
  parallelism:
    max_parallel_jobs: 4
    cpu_multiplier: 1.0
    memory_per_job_gb: 2
    enable_distributed_builds: false
  
  # Artifact Configuration
  artifacts:
    retention_days: 30
    compression_level: 6
    include_debug_symbols: false
    sign_artifacts: false
  
  # Build Optimization
  optimization:
    enable_incremental_builds: true
    enable_build_cache: true
    enable_dependency_cache: true
    cache_compression: "zstd"
    cache_version: "v3"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  # Test Suites
  suites:
    unit:
      enabled: true
      timeout_minutes: 15
      coverage_threshold: 90
      fail_fast: false
    integration:
      enabled: true
      timeout_minutes: 30
      coverage_threshold: 80
      fail_fast: false
    property:
      enabled: true
      timeout_minutes: 45
      iterations: 2000
      fail_fast: false
    security:
      enabled: true
      timeout_minutes: 20
      fail_fast: true
    negative:
      enabled: true
      timeout_minutes: 25
      fail_fast: false
    performance:
      enabled: true
      timeout_minutes: 60
      benchmark_iterations: 100
      fail_fast: false
    stress:
      enabled: false
      timeout_minutes: 120
      fail_fast: true
  
  # Test Execution
  execution:
    parallel_execution: true
    max_parallel_suites: 3
    retry_failed_tests: 2
    generate_reports: true
    upload_coverage: true
  
  # Property-Based Testing
  property_testing:
    framework: "hypothesis"
    max_examples: 2000
    deadline_ms: 10000
    suppress_health_checks: ["too_slow"]
    profile: "ci"
    statistics: true

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
security:
  # Security Scanning
  scanning:
    enabled: true
    fail_on_high: true
    fail_on_critical: true
    vulnerability_threshold: "moderate"
    
    # Dependency Scanning
    dependencies:
      npm_audit: true
      pip_audit: true
      safety_check: true
      gradle_dependency_check: true
    
    # Static Analysis
    static_analysis:
      semgrep: true
      bandit: true
      eslint_security: true
      codeql: false  # Enable for public repositories
    
    # Secret Detection
    secrets:
      trufflehog: true
      custom_patterns: true
      entropy_detection: true
    
    # Cryptographic Validation
    crypto:
      validate_algorithms: true
      check_key_sizes: true
      verify_implementations: true
  
  # Security Policies
  policies:
    require_signed_commits: false
    require_branch_protection: true
    require_status_checks: true
    require_up_to_date_branches: true
    dismiss_stale_reviews: true
    require_code_owner_reviews: false

# ============================================================================
# CODE QUALITY CONFIGURATION
# ============================================================================
quality:
  # Linting Configuration
  linting:
    javascript:
      tool: "eslint"
      config: ".eslintrc.js"
      max_warnings: 0
      security_rules: true
    python:
      tools: ["flake8", "pylint", "bandit"]
      max_complexity: 10
      max_line_length: 127
      security_rules: true
    kotlin:
      tool: "ktlint"
      detekt: true
      security_rules: true
  
  # Code Formatting
  formatting:
    javascript:
      tool: "prettier"
      enforce: true
    python:
      tools: ["black", "isort"]
      enforce: true
    kotlin:
      tool: "ktlint"
      enforce: true
  
  # Type Checking
  type_checking:
    typescript:
      strict: true
      no_implicit_any: true
    python:
      tool: "mypy"
      strict: true
      ignore_missing_imports: true

# ============================================================================
# PERFORMANCE CONFIGURATION
# ============================================================================
performance:
  # Benchmarking
  benchmarking:
    enabled: true
    framework: "pytest-benchmark"
    min_rounds: 5
    max_time_seconds: 300
    sort_by: "mean"
    
    # Benchmark Types
    types:
      cpu: true
      memory: true
      io: true
      crypto: true
      network: true
  
  # Profiling
  profiling:
    enabled: true
    tools: ["py-spy", "memory-profiler"]
    duration_seconds: 30
    output_format: "svg"
  
  # Performance Thresholds
  thresholds:
    cpu_usage_percent: 80
    memory_usage_mb: 512
    response_time_ms: 100
    throughput_ops_per_sec: 1000

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment:
  # Environments
  environments:
    staging:
      auto_deploy: true
      require_approval: false
      run_smoke_tests: true
    production:
      auto_deploy: false
      require_approval: true
      run_full_tests: true
  
  # Artifact Packaging
  packaging:
    create_checksums: true
    sign_packages: false
    include_source_maps: false
    compress_assets: true
  
  # Release Management
  releases:
    auto_generate_notes: true
    include_changelog: true
    attach_artifacts: true
    create_github_release: true

# ============================================================================
# NOTIFICATION CONFIGURATION
# ============================================================================
notifications:
  # Channels
  channels:
    slack: false
    email: false
    github_issues: true
    github_discussions: false
  
  # Triggers
  triggers:
    build_failure: true
    security_issues: true
    performance_regression: true
    deployment_success: false
    deployment_failure: true

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
cache:
  # Cache Strategy
  strategy: "aggressive"
  version: "v3"
  compression: "zstd"
  
  # Cache Types
  types:
    dependencies:
      retention_days: 14
      size_limit_gb: 5
      cross_os: true
    builds:
      retention_days: 7
      size_limit_gb: 3
      cross_os: false
    tests:
      retention_days: 3
      size_limit_gb: 1
      cross_os: false
  
  # Cache Management
  management:
    auto_cleanup: true
    cleanup_schedule: "daily"
    size_monitoring: true
    hit_rate_monitoring: true

# ============================================================================
# MONITORING AND METRICS
# ============================================================================
monitoring:
  # Metrics Collection
  metrics:
    build_times: true
    test_execution_times: true
    cache_hit_rates: true
    artifact_sizes: true
    resource_usage: true
  
  # Alerting
  alerting:
    build_time_regression: true
    test_failure_rate: true
    security_vulnerabilities: true
    performance_degradation: true
  
  # Reporting
  reporting:
    generate_dashboards: false
    export_metrics: true
    retention_days: 90