# GURU Personal Assistant - Build Optimization Pipeline
# Advanced build optimization with parallel execution and intelligent caching
# Maximizes build performance while maintaining quality standards

name: 'Build Optimization'

on:
  workflow_call:
    inputs:
      optimization_level:
        description: 'Build optimization level'
        required: false
        type: string
        default: 'balanced'
      parallel_jobs:
        description: 'Number of parallel jobs'
        required: false
        type: number
        default: 4
      enable_ccache:
        description: 'Enable compiler cache'
        required: false
        type: boolean
        default: true

env:
  # Build Optimization Configuration
  OPTIMIZATION_LEVEL: ${{ inputs.optimization_level || 'balanced' }}
  PARALLEL_JOBS: ${{ inputs.parallel_jobs || 4 }}
  CCACHE_ENABLED: ${{ inputs.enable_ccache || true }}
  
  # Compiler and Build Tool Optimization
  CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.parallel_jobs || 4 }}
  MAKEFLAGS: "-j${{ inputs.parallel_jobs || 4 }}"
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=${{ inputs.parallel_jobs || 4 }}"
  
  # Memory and Performance Tuning
  NODE_OPTIONS: "--max-old-space-size=4096"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "0"

jobs:
  # ============================================================================
  # BUILD ENVIRONMENT OPTIMIZATION
  # ============================================================================
  optimize-build-environment:
    name: 'Optimize Build Environment'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        
    outputs:
      optimization-config: ${{ steps.config.outputs.optimization-config }}
      
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        
      - name: 'Configure Build Optimization'
        id: config
        run: |
          echo "::group::Build Optimization Configuration"
          
          # Determine optimal configuration based on runner and optimization level
          case "${{ env.OPTIMIZATION_LEVEL }}" in
            "maximum")
              COMPILER_FLAGS="-O3 -march=native -flto"
              BUILD_TYPE="Release"
              PARALLEL_FACTOR=1.5
              ;;
            "balanced")
              COMPILER_FLAGS="-O2 -flto"
              BUILD_TYPE="RelWithDebInfo"
              PARALLEL_FACTOR=1.0
              ;;
            "debug")
              COMPILER_FLAGS="-O0 -g"
              BUILD_TYPE="Debug"
              PARALLEL_FACTOR=0.8
              ;;
            *)
              COMPILER_FLAGS="-O2"
              BUILD_TYPE="Release"
              PARALLEL_FACTOR=1.0
              ;;
          esac
          
          # Calculate optimal parallel jobs
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CPU_COUNT=$(wmic cpu get NumberOfCores /value | findstr NumberOfCores | cut -d'=' -f2)
          else
            CPU_COUNT=$(nproc)
          fi
          
          OPTIMAL_JOBS=$(echo "$CPU_COUNT * $PARALLEL_FACTOR" | bc | cut -d'.' -f1)
          OPTIMAL_JOBS=${OPTIMAL_JOBS:-${{ env.PARALLEL_JOBS }}}
          
          # Create optimization configuration
          OPTIMIZATION_CONFIG=$(cat << EOF
          {
            "compiler_flags": "$COMPILER_FLAGS",
            "build_type": "$BUILD_TYPE",
            "parallel_jobs": $OPTIMAL_JOBS,
            "cpu_count": $CPU_COUNT,
            "optimization_level": "${{ env.OPTIMIZATION_LEVEL }}",
            "platform": "${{ runner.os }}"
          }
          EOF
          )
          
          echo "optimization-config=$(echo "$OPTIMIZATION_CONFIG" | jq -c .)" >> $GITHUB_OUTPUT
          
          echo "🔧 Build Optimization Configuration:"
          echo "$OPTIMIZATION_CONFIG" | jq .
          
          echo "::endgroup::"
          
      - name: 'Setup Compiler Cache'
        if: env.CCACHE_ENABLED == 'true' && runner.os == 'Linux'
        run: |
          echo "::group::Compiler Cache Setup"
          
          # Install and configure ccache
          sudo apt-get update
          sudo apt-get install -y ccache
          
          # Configure ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=cache_dir=$HOME/.ccache
          
          # Show ccache configuration
          ccache --show-config
          ccache --show-stats
          
          echo "✅ Compiler cache configured"
          echo "::endgroup::"
          
      - name: 'Optimize System Resources'
        run: |
          echo "::group::System Resource Optimization"
          
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # Linux optimizations
            echo "🐧 Linux Build Optimizations:"
            
            # Increase file descriptor limits
            ulimit -n 65536
            echo "- File descriptor limit: $(ulimit -n)"
            
            # Optimize memory settings
            echo "- Available memory: $(free -h | grep Mem | awk '{print $2}')"
            echo "- Available disk space: $(df -h / | tail -1 | awk '{print $4}')"
            
            # Set optimal I/O scheduler (if possible)
            echo "- I/O scheduler: $(cat /sys/block/sda/queue/scheduler 2>/dev/null || echo 'default')"
            
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows optimizations
            echo "🪟 Windows Build Optimizations:"
            
            # Show system information
            echo "- CPU cores: $(wmic cpu get NumberOfCores /value | findstr NumberOfCores)"
            echo "- Total memory: $(wmic computersystem get TotalPhysicalMemory /value | findstr Total)"
            echo "- Available disk space: $(wmic logicaldisk get size,freespace /value | findstr Free)"
            
            # Optimize Windows Defender (if possible)
            echo "- Windows Defender real-time protection may impact build performance"
          fi
          
          echo "::endgroup::"
          
      - name: 'Upload Optimization Config'
        uses: actions/upload-artifact@v4
        with:
          name: build-optimization-config-${{ runner.os }}
          path: |
            optimization-config.json
          retention-days: 7

  # ============================================================================
  # PARALLEL BUILD EXECUTION
  # ============================================================================
  parallel-build-execution:
    name: 'Parallel Build Execution'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: optimize-build-environment
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        component: [desktop-agent, phone-agent, shared-components]
        
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        
      - name: 'Setup Build Environment'
        run: |
          echo "::group::Build Environment Setup"
          
          # Extract optimization configuration
          OPTIMIZATION_CONFIG='${{ needs.optimize-build-environment.outputs.optimization-config }}'
          echo "Using optimization config: $OPTIMIZATION_CONFIG"
          
          # Set environment variables from config
          PARALLEL_JOBS=$(echo "$OPTIMIZATION_CONFIG" | jq -r '.parallel_jobs')
          BUILD_TYPE=$(echo "$OPTIMIZATION_CONFIG" | jq -r '.build_type')
          
          echo "PARALLEL_JOBS=$PARALLEL_JOBS" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          
          echo "::endgroup::"
          
      - name: 'Setup Node.js with Optimization'
        if: matrix.component != 'phone-agent'
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          
      - name: 'Setup Python with Optimization'
        if: matrix.component == 'desktop-agent'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 'Setup JDK with Optimization'
        if: matrix.component == 'phone-agent'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: 'Build Desktop Agent (Optimized)'
        if: matrix.component == 'desktop-agent'
        working-directory: desktop-agent
        run: |
          echo "::group::Optimized Desktop Agent Build"
          
          # Install dependencies with optimization
          pip install -r requirements.txt --prefer-binary --no-compile
          
          # Parallel build configuration
          export MAKEFLAGS="-j${{ env.PARALLEL_JOBS }}"
          export CMAKE_BUILD_PARALLEL_LEVEL="${{ env.PARALLEL_JOBS }}"
          
          # Build with optimization
          python -m build --wheel --sdist
          
          # Build Tauri app with optimization
          cd tray-app
          npm ci --prefer-offline --no-audit
          npm run tauri build -- --config "src-tauri/tauri.conf.optimized.json"
          
          echo "✅ Desktop agent build completed"
          echo "::endgroup::"
          
      - name: 'Build Phone Agent (Optimized)'
        if: matrix.component == 'phone-agent'
        working-directory: phone-agent
        run: |
          echo "::group::Optimized Phone Agent Build"
          
          # Configure Gradle for optimal performance
          cat >> gradle.properties << EOF
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.workers.max=${{ env.PARALLEL_JOBS }}
          android.enableBuildCache=true
          android.enableR8.fullMode=true
          EOF
          
          # Parallel build execution
          ./gradlew assembleRelease bundleRelease \
            --parallel \
            --build-cache \
            --configuration-cache \
            --max-workers=${{ env.PARALLEL_JOBS }}
          
          echo "✅ Phone agent build completed"
          echo "::endgroup::"
          
      - name: 'Build Shared Components (Optimized)'
        if: matrix.component == 'shared-components'
        run: |
          echo "::group::Optimized Shared Components Build"
          
          # Install dependencies with optimization
          npm ci --prefer-offline --no-audit --maxsockets=10
          
          # Parallel TypeScript compilation
          npx tsc --build --verbose --force \
            shared/tsconfig.json \
            memory/tsconfig.json \
            skills/tsconfig.json \
            agents/tsconfig.json \
            infra/tsconfig.json
          
          echo "✅ Shared components build completed"
          echo "::endgroup::"
          
      - name: 'Generate Build Metrics'
        run: |
          echo "::group::Build Metrics Collection"
          
          # Collect build metrics
          cat > build-metrics-${{ matrix.component }}-${{ runner.os }}.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "component": "${{ matrix.component }}",
            "platform": "${{ runner.os }}",
            "optimization_level": "${{ env.OPTIMIZATION_LEVEL }}",
            "parallel_jobs": ${{ env.PARALLEL_JOBS }},
            "build_type": "${{ env.BUILD_TYPE }}",
            "build_duration_seconds": ${{ github.event.workflow_run.run_duration_ms || 0 }},
            "success": true
          }
          EOF
          
          echo "📊 Build metrics collected for ${{ matrix.component }}"
          echo "::endgroup::"
          
      - name: 'Upload Build Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: optimized-build-${{ matrix.component }}-${{ runner.os }}
          path: |
            desktop-agent/dist/
            desktop-agent/tray-app/src-tauri/target/release/
            phone-agent/app/build/outputs/
            shared/dist/
            memory/dist/
            skills/dist/
            agents/dist/
            infra/dist/
            build-metrics-*.json
          retention-days: 7
          compression-level: 6

  # ============================================================================
  # BUILD PERFORMANCE ANALYSIS
  # ============================================================================
  build-performance-analysis:
    name: 'Build Performance Analysis'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: parallel-build-execution
    if: always()
    
    steps:
      - name: 'Download Build Metrics'
        uses: actions/download-artifact@v4
        with:
          pattern: optimized-build-*
          path: build-artifacts/
          merge-multiple: true
          
      - name: 'Analyze Build Performance'
        run: |
          echo "::group::Build Performance Analysis"
          
          # Collect all build metrics
          find build-artifacts -name "build-metrics-*.json" -exec cat {} \; | jq -s . > combined-metrics.json
          
          # Generate performance report
          python3 << 'EOF'
          import json
          import statistics
          from datetime import datetime
          
          # Load metrics
          with open('combined-metrics.json') as f:
              metrics = json.load(f)
          
          if not metrics:
              print("No build metrics found")
              exit(0)
          
          # Analyze performance by component and platform
          components = {}
          platforms = {}
          
          for metric in metrics:
              component = metric.get('component', 'unknown')
              platform = metric.get('platform', 'unknown')
              duration = metric.get('build_duration_seconds', 0)
              
              if component not in components:
                  components[component] = []
              components[component].append(duration)
              
              if platform not in platforms:
                  platforms[platform] = []
              platforms[platform].append(duration)
          
          # Generate report
          report = {
              "analysis_timestamp": datetime.utcnow().isoformat() + "Z",
              "total_builds": len(metrics),
              "optimization_level": metrics[0].get('optimization_level', 'unknown'),
              "performance_by_component": {},
              "performance_by_platform": {},
              "recommendations": []
          }
          
          # Component analysis
          for component, durations in components.items():
              if durations:
                  report["performance_by_component"][component] = {
                      "builds": len(durations),
                      "avg_duration_seconds": statistics.mean(durations),
                      "min_duration_seconds": min(durations),
                      "max_duration_seconds": max(durations)
                  }
          
          # Platform analysis
          for platform, durations in platforms.items():
              if durations:
                  report["performance_by_platform"][platform] = {
                      "builds": len(durations),
                      "avg_duration_seconds": statistics.mean(durations),
                      "min_duration_seconds": min(durations),
                      "max_duration_seconds": max(durations)
                  }
          
          # Generate recommendations
          avg_duration = statistics.mean([m.get('build_duration_seconds', 0) for m in metrics])
          
          if avg_duration > 1800:  # 30 minutes
              report["recommendations"].append("Consider increasing parallel jobs for faster builds")
          if avg_duration > 3600:  # 60 minutes
              report["recommendations"].append("Investigate build bottlenecks and optimize critical path")
          
          report["recommendations"].append("Monitor cache hit rates to improve build performance")
          report["recommendations"].append("Consider using distributed builds for large projects")
          
          # Save report
          with open('build-performance-report.json', 'w') as f:
              json.dump(report, f, indent=2)
          
          # Print summary
          print("🚀 Build Performance Summary:")
          print(f"  Total builds: {len(metrics)}")
          print(f"  Average duration: {avg_duration:.1f} seconds")
          print(f"  Optimization level: {metrics[0].get('optimization_level', 'unknown')}")
          
          print("\n📊 Performance by Component:")
          for component, stats in report["performance_by_component"].items():
              print(f"  {component}: {stats['avg_duration_seconds']:.1f}s avg")
          
          print("\n💡 Recommendations:")
          for rec in report["recommendations"]:
              print(f"  - {rec}")
          EOF
          
          echo "::endgroup::"
          
      - name: 'Upload Performance Report'
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-analysis
          path: |
            build-performance-report.json
            combined-metrics.json
          retention-days: 30