# =============================================================================
# Agent Guru - CI
# =============================================================================
#
# What changed, and why (the previous version of this file ran none of this):
#
#   * The project's real pytest suite is now executed. Before, CI ran
#     `python scripts/test_all.py` - a 163-line hand-written script - and the
#     word "pytest" appeared nowhere in .github/workflows/. 4,919 real tests
#     were never run by CI. scripts/test_all.py is KEPT, as an additional
#     check, not as a substitute.
#
#   * Python coverage matches the project's declared support policy rather
#     than one version. pyproject.toml sets requires-python = ">=3.11" and
#     classifies 3.11, 3.12 and 3.13; [tool.black] and [tool.ruff] both target
#     py311. CI previously tested 3.13 only, so nothing verified the floor.
#
#   * Dependencies come from the repository's own declared configuration -
#     the `test` extra in pyproject.toml - instead of `requirements.txt`,
#     which pulls onnxruntime-gpu (no wheel without CUDA) and insightface
#     (needs a C toolchain) and cannot install on a stock runner at all.
#
#   * Lint, type checking and security scanning are separated into gates that
#     BLOCK and reports that INFORM, with today's measured counts recorded
#     below each one. Nothing is silenced: the advisory jobs publish their
#     full output as artifacts on every run.
#
# =============================================================================

name: CI - Agent Guru

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  # Reproducibility: fix the hash seed so dict/set iteration order is stable
  # across runs. Hypothesis is already pinned to derandomize = True in
  # pytest.ini, so a failing example reproduces from the log.
  PYTHONHASHSEED: "0"

jobs:

  # ---------------------------------------------------------------------------
  # Gate 1 - errors that are errors.
  # Blocking. `ruff check --select F,E9,PLE` reports undefined names, unused
  # imports and bindings, syntax errors and pylint-error-class findings. This
  # selection is clean across the repository as of this commit, so a new
  # violation is a genuine regression and CI should refuse it.
  # ---------------------------------------------------------------------------
  lint-errors:
    name: Lint - real errors (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install lint tooling
        run: pip install "ruff>=0.1.9"

      - name: ruff (error-class rules only)
        run: ruff check . --select F,E9,PLE --output-format=github

  # ---------------------------------------------------------------------------
  # Report 1 - the full configured lint, and formatting.
  # NON-BLOCKING, and deliberately so: [tool.ruff.lint] sets select = ["ALL"],
  # which reports 2,512 findings today, and `black --check` wants to reformat
  # 195 of 806 files. Making either blocking would turn CI permanently red and
  # teach everyone to ignore it. The counts are published on every run so the
  # backlog is visible and can be ratcheted down; they are not hidden.
  # ---------------------------------------------------------------------------
  lint-full:
    name: Lint - full report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install lint tooling
        run: pip install "ruff>=0.1.9" "black>=23.12.0"

      - name: ruff - full configured rule set
        run: |
          ruff check . --output-format=concise --exit-zero | tee ruff-full.txt
          ruff check . --statistics --exit-zero | tee ruff-stats.txt
          {
            echo "### ruff - full rule set (advisory)"
            echo ""
            echo "Findings: $(grep -c ': ' ruff-full.txt || echo 0)  (baseline at CI rewrite: 2512)"
            echo ""
            echo '```'
            head -30 ruff-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: black - formatting drift
        run: |
          black --check --diff . > black.diff 2>&1 || true
          {
            echo "### black (advisory)"
            echo ""
            tail -3 black.diff
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-full.txt
            ruff-stats.txt
            black.diff
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Report 2 - type checking.
  # NON-BLOCKING. mypy.ini sets strict = true and currently reports 1,742
  # errors across 360 of 976 source files. That number is the point of this
  # job: it is published every run so it can only go down.
  #
  # Note for anyone editing the type configuration: BOTH mypy.ini and a
  # [tool.mypy] block in pyproject.toml exist, and mypy.ini wins. The
  # pyproject block is dead configuration.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type check - mypy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install mypy
        run: pip install "mypy>=1.8.0" types-PyYAML types-requests

      - name: mypy
        run: |
          mypy Agent_Guru > mypy.txt 2>&1 || true
          {
            echo "### mypy --strict (advisory)"
            echo ""
            echo '```'
            tail -3 mypy.txt
            echo '```'
            echo ""
            echo "Baseline at CI rewrite: 1742 errors in 360 files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Gate 2 - security.
  # Blocking. bandit reports zero issues across Agent_Guru/ as of this commit
  # (verified), so this is a gate that can hold. The dependency audit is
  # separate and advisory: a newly published CVE in a third-party package is
  # not a reason to block a pull request that did not introduce it.
  # ---------------------------------------------------------------------------
  security:
    name: Security - bandit (blocking) + dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install security tooling
        run: pip install "bandit[toml]>=1.7.6" pip-audit

      - name: bandit - static analysis (blocking)
        run: bandit -r Agent_Guru -c pyproject.toml -f screen

      - name: bandit - machine-readable report
        if: always()
        run: bandit -r Agent_Guru -c pyproject.toml -f json -o bandit.json || true

      - name: pip-audit - known vulnerable dependencies (advisory)
        run: |
          pip-audit -r requirements-lock.txt --format json --output pip-audit.json || true
          {
            echo "### pip-audit (advisory)"
            echo ""
            echo "Audited requirements-lock.txt; see the pip-audit artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            pip-audit.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate 3 - the actual test suite.
  # Blocking, across the declared Python range and every platform the README
  # calls production-ready.
  #
  # Honest note: this job is RED today. The suite collects cleanly (4,919
  # tests, zero collection errors on Linux) but a substantial number of tests
  # fail. Those failures are real and are being worked through; making this
  # job non-blocking to get a green tick would defeat the entire purpose of
  # adding it.
  # ---------------------------------------------------------------------------
  test:
    name: pytest - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform pyproject.toml classifies; Linux and macOS
        # are claimed "production ready" by the README, so they are tested
        # rather than assumed.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      # sounddevice binds PortAudio at import time. Windows wheels ship the
      # DLL; Linux and macOS do not, and without it eight test modules fail
      # to import with OSError: PortAudio library not found - a collection
      # error, not a skip.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      # The suite imports torch for real. Installing it from PyPI on a GPU-less
      # runner drags in ~2.5 GB of CUDA wheels that will never be used, so the
      # CPU index goes first and wins the resolution.
      - name: Install PyTorch (CPU build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and declared test dependencies
        run: pip install -e ".[test]"

      - name: Record the resolved environment
        run: |
          python -VV
          pip freeze > pip-freeze-${{ matrix.os }}-${{ matrix.python-version }}.txt

      # Several tests exercise a real sentence-transformers model. Caching the
      # HuggingFace directory turns a ~90 MB download into a cache hit.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      # Collection is checked on its own so that an import error is reported
      # as an import error, not buried among test failures.
      - name: Collect the test suite
        run: pytest --collect-only -q

      - name: Run the test suite
        run: >
          pytest
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
          --cov=Agent_Guru
          --cov-report=xml:coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml
          --cov-report=term-missing:skip-covered

      # Kept deliberately: the hand-written functional script the previous CI
      # ran. pytest replaces nothing here, it adds to it.
      - name: Functional checks (scripts/test_all.py)
        if: always()
        run: python scripts/test_all.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage-*.xml
            pip-freeze-*.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # A single check to require on the branch, so the protection rule does not
  # have to enumerate every matrix leg.
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint-errors, security, test]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "lint-errors: ${{ needs.lint-errors.result }}"
          echo "security:    ${{ needs.security.result }}"
          echo "test:        ${{ needs.test.result }}"
          if [ "${{ needs.lint-errors.result }}" != "success" ] \
          || [ "${{ needs.security.result }}" != "success" ] \
          || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required CI job failed."
            exit 1
          fi
