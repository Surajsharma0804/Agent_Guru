name: Agent Guru CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-cpu.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Code Formatting Check
      run: |
        black --check .
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type Check with mypy
      run: |
        mypy guru_speech guru_vision guru_llm guru_platform guru_agents guru_memory guru_deployment guru_policy guru_security guru_avatar --ignore-missing-imports || true
    
    - name: Run Tests
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term
    
    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
    
    - name: Verify Project Structure
      run: |
        echo "Verifying Python project structure..."
        python -c "import sys; print(f'Python {sys.version}')"
        
        echo "Checking module directories..."
        for module in guru_speech guru_vision guru_llm guru_platform guru_agents guru_memory guru_deployment guru_policy guru_security guru_avatar; do
          if [ -d "$module" ]; then
            echo "✓ $module exists"
          else
            echo "✗ $module missing"
            exit 1
          fi
        done
        
        echo "All modules verified successfully!"
    
    - name: Check Dependencies
      run: |
        echo "Checking requirements files..."
        if [ -f "requirements.txt" ]; then
          echo "✓ requirements.txt found"
          cat requirements.txt
        fi
        if [ -f "requirements-cpu.txt" ]; then
          echo "✓ requirements-cpu.txt found"
        fi
        if [ -f "pyproject.toml" ]; then
          echo "✓ pyproject.toml found"
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check Dependencies for Vulnerabilities
      run: |
        pip install -r requirements-cpu.txt
        safety check --json || true
    
    - name: Run Bandit Security Scan
      run: |
        bandit -r guru_speech guru_vision guru_llm guru_platform guru_agents guru_memory guru_deployment guru_policy guru_security guru_avatar -f json -o bandit-report.json || true
        bandit -r . -ll || true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: always()
    
    steps:
    - name: Check Status
      run: |
        echo "CI Pipeline Status:"
        echo "- Test: ${{ needs.test.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Security: ${{ needs.security.result }}"
        
        if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ CI Pipeline Passed"
          exit 0
        else
          echo "❌ CI Pipeline Failed"
          exit 1
        fi
