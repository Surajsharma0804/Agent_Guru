name: Agent Guru CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Code Formatting Check with Black
      run: |
        black --check Agent_Guru/
        if [ $? -ne 0 ]; then
          echo "❌ Black formatting check failed"
          exit 1
        fi
    
    - name: Lint with Ruff
      run: |
        ruff check Agent_Guru/
        if [ $? -ne 0 ]; then
          echo "❌ Ruff linting failed"
          exit 1
        fi
    
    - name: Type Check with mypy
      run: |
        mypy Agent_Guru/reasoning --strict
        if [ $? -ne 0 ]; then
          echo "❌ mypy type checking failed"
          exit 1
        fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libdbus-1-dev \
          libdbus-glib-1-dev \
          libgirepository1.0-dev \
          pkg-config \
          portaudio19-dev \
          python3-dev \
          build-essential
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        if [ -f requirements-cpu.txt ]; then
          pip install -r requirements-cpu.txt
        fi
    
    - name: Run Unit Tests with Coverage
      run: |
        pytest Agent_Guru/reasoning/tests \
          --cov=Agent_Guru/reasoning \
          --cov-report=xml \
          --cov-report=term-missing \
          -v \
          -m "not property" || echo "⚠️ Tests failed or no tests found yet"
      continue-on-error: true
    
    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-py${{ matrix.python-version }}
        fail_ci_if_error: false

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libdbus-1-dev \
          libdbus-glib-1-dev \
          libgirepository1.0-dev \
          pkg-config \
          portaudio19-dev \
          python3-dev \
          build-essential
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        if [ -f requirements-cpu.txt ]; then
          pip install -r requirements-cpu.txt
        fi
    
    - name: Run Property-Based Tests with Hypothesis
      run: |
        pytest Agent_Guru/reasoning/tests \
          -v \
          -m "property" \
          --hypothesis-show-statistics \
          --hypothesis-seed=0 || echo "⚠️ Property tests failed or no tests found yet"
      continue-on-error: true
      env:
        HYPOTHESIS_PROFILE: ci

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libdbus-1-dev \
          libdbus-glib-1-dev \
          libgirepository1.0-dev \
          pkg-config \
          portaudio19-dev \
          python3-dev \
          build-essential
    
    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check Dependencies for Vulnerabilities with Safety
      run: |
        if [ -f requirements-cpu.txt ]; then
          pip install -r requirements-cpu.txt
        fi
        pip install -e ".[dev]"
        safety check --json > safety-report.json || true
        safety check || echo "⚠️ Vulnerabilities found, check safety-report.json"
    
    - name: Run Bandit Security Scan
      run: |
        bandit -r Agent_Guru/reasoning -f json -o bandit-report.json || echo "⚠️ Bandit found issues"
        bandit -r Agent_Guru/reasoning -ll || echo "⚠️ Security issues found"
      continue-on-error: true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests, property-tests, security]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
    
    - name: Build Package
      run: |
        python -m build
        if [ $? -ne 0 ]; then
          echo "❌ Package build failed"
          exit 1
        fi
    
    - name: Verify Package
      run: |
        pip install dist/*.whl
        python -c "import Agent_Guru; print('✓ Package installed successfully')"

  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, property-tests, security, build]
    if: always()
    
    steps:
    - name: Check All Jobs Status
      run: |
        echo "CI Pipeline Status:"
        echo "- Lint: ${{ needs.lint.result }}"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        echo "- Property Tests: ${{ needs.property-tests.result }}"
        echo "- Security: ${{ needs.security.result }}"
        echo "- Build: ${{ needs.build.result }}"
        
        if [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.property-tests.result }}" != "success" ] || \
           [ "${{ needs.security.result }}" != "success" ] || \
           [ "${{ needs.build.result }}" != "success" ]; then
          echo "❌ CI Pipeline Failed"
          exit 1
        fi
        
        echo "✅ CI Pipeline Passed Successfully"

