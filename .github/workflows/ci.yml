# =============================================================================
# Agent Guru - CI
# =============================================================================
#
# What changed, and why (the previous version of this file ran none of this):
#
#   * The project's real pytest suite is now executed. Before, CI ran
#     `python scripts/test_all.py` - a 163-line hand-written script - and the
#     word "pytest" appeared nowhere in .github/workflows/. 4,919 real tests
#     were never run by CI. scripts/test_all.py is KEPT, as an additional
#     check, not as a substitute.
#
#   * Python coverage matches the project's declared support policy rather
#     than one version. pyproject.toml sets requires-python = ">=3.11" and
#     classifies 3.11, 3.12 and 3.13; [tool.black] and [tool.ruff] both target
#     py311. CI previously tested 3.13 only, so nothing verified the floor.
#
#   * Dependencies come from the repository's own declared configuration -
#     the `test` extra in pyproject.toml - instead of `requirements.txt`,
#     which pulls onnxruntime-gpu (no wheel without CUDA) and insightface
#     (needs a C toolchain) and cannot install on a stock runner at all.
#
#   * Lint, type checking and security scanning are separated into gates that
#     BLOCK and reports that INFORM, with today's measured counts recorded
#     below each one. Nothing is silenced: the advisory jobs publish their
#     full output as artifacts on every run.
#
#   * The dependency audit blocks on unaccepted critical and high advisories
#     and reports into the job summary and a tracking issue. It used to run
#     with `|| true` into an artifact nobody opened; see the dependency-audit
#     job for why that let 145 alerts accumulate.
#
# =============================================================================

name: CI - Agent Guru

# ---------------------------------------------------------------------------
# Two kinds of run, chosen to fit the GitHub Actions minute allowance.
#
#   * push and pull_request: the gate. Linux only - lint, security, mypy and
#     pytest on Python 3.11, 3.12 and 3.13.
#   * schedule (weekly) and workflow_dispatch (by hand): the platform run.
#     pytest on Windows (3.11, 3.12, 3.13) and macOS (3.13), plus the
#     dependency audit, which is under a minute of Linux time.
#
# Why. GitHub bills Linux minutes 1x, Windows 2x and macOS 10x against a
# 3,000 minute monthly allowance, and each test leg takes about 19 minutes:
#
#   old matrix, every push and PR:
#     3 Linux legs    x 19 min x  1  =  57
#     3 Windows legs  x 19 min x  2  = 114
#     1 macOS leg     x 19 min x 10  = 190
#                                     -----
#                                      361 billed minutes per run
#
#   Linux only: 57 billed minutes per run.
#
# (The lint, security and mypy jobs add a few minutes on top of either.)
# At 361 minutes a run the allowance covered about eight pushes a month, and
# it ran out on 2026-09-24, after which GitHub refused every job. At 57 it
# covers about fifty.
#
# The Windows and macOS legs were already non-blocking (continue-on-error),
# so 304 of every 361 minutes bought a signal that no pull request was gated
# on. They now run weekly and on demand instead.
#
#   weekly platform run: 304 billed minutes x about 4.3 runs a month
#                        = about 1,300 billed minutes a month
#
# That leaves about 1,700 minutes, roughly 30 Linux gate runs a month. Each
# extra platform run triggered by hand costs another 304. A nightly schedule
# would cost about 9,100 minutes a month, three times the allowance.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays 03:00 UTC. Scheduled runs use the default branch.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run's result irrelevant.
# Platform runs get their own group: they run on main too, and sharing the
# group would let a push to main cancel a weekly run, or the reverse.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    && 'platforms' || 'gate' }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  # Reproducibility: fix the hash seed so dict/set iteration order is stable
  # across runs. Hypothesis is already pinned to derandomize = True in
  # pytest.ini, so a failing example reproduces from the log.
  PYTHONHASHSEED: "0"

jobs:

  # ---------------------------------------------------------------------------
  # Gate 1 - errors that are errors.
  # Blocking. `ruff check --select F,E9,PLE` reports undefined names, unused
  # imports and bindings, syntax errors and pylint-error-class findings. This
  # selection is clean across the repository as of this commit, so a new
  # violation is a genuine regression and CI should refuse it.
  # ---------------------------------------------------------------------------
  lint-errors:
    name: Lint - real errors (blocking)
    # Gate run only; the platform run is pytest on Windows and macOS.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install lint tooling
        run: pip install "ruff>=0.1.9"

      - name: ruff (error-class rules only)
        run: ruff check . --select F,E9,PLE --output-format=github

  # ---------------------------------------------------------------------------
  # Report 1 - the full configured lint, and formatting.
  # NON-BLOCKING, and deliberately so: [tool.ruff.lint] sets select = ["ALL"],
  # which reports 2,512 findings today, and `black --check` wants to reformat
  # 195 of 806 files. Making either blocking would turn CI permanently red and
  # teach everyone to ignore it. The counts are published on every run so the
  # backlog is visible and can be ratcheted down; they are not hidden.
  # ---------------------------------------------------------------------------
  lint-full:
    name: Lint - full report (advisory)
    # Gate run only; the platform run is pytest on Windows and macOS.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install lint tooling
        run: pip install "ruff>=0.1.9" "black>=23.12.0"

      - name: ruff - full configured rule set
        run: |
          ruff check . --output-format=concise --exit-zero | tee ruff-full.txt
          ruff check . --statistics --exit-zero | tee ruff-stats.txt
          {
            echo "### ruff - full rule set (advisory)"
            echo ""
            echo "Findings: $(grep -c ': ' ruff-full.txt || echo 0)  (baseline at CI rewrite: 2512)"
            echo ""
            echo '```'
            head -30 ruff-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: black - formatting drift
        run: |
          black --check --diff . > black.diff 2>&1 || true
          {
            echo "### black (advisory)"
            echo ""
            tail -3 black.diff
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-full.txt
            ruff-stats.txt
            black.diff
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Report 2 - type checking.
  # NON-BLOCKING. mypy.ini sets strict = true and currently reports 1,742
  # errors across 360 of 976 source files. That number is the point of this
  # job: it is published every run so it can only go down.
  #
  # Note for anyone editing the type configuration: BOTH mypy.ini and a
  # [tool.mypy] block in pyproject.toml exist, and mypy.ini wins. The
  # pyproject block is dead configuration.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type check - mypy (advisory)
    # Gate run only; the platform run is pytest on Windows and macOS.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install mypy
        run: pip install "mypy>=1.8.0" types-PyYAML types-requests

      - name: mypy
        run: |
          mypy Agent_Guru > mypy.txt 2>&1 || true
          {
            echo "### mypy --strict (advisory)"
            echo ""
            echo '```'
            tail -3 mypy.txt
            echo '```'
            echo ""
            echo "Baseline at CI rewrite: 1742 errors in 360 files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Gate 2 - security.
  # Blocking. bandit reports zero issues across Agent_Guru/ as of this commit
  # (verified), so this is a gate that can hold. The dependency audit is its
  # own job, below.
  # ---------------------------------------------------------------------------
  security:
    name: Security - bandit (blocking)
    # Gate run only; the platform run is pytest on Windows and macOS.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install security tooling
        run: pip install "bandit[toml]>=1.7.6"

      - name: bandit - static analysis (blocking)
        run: bandit -r Agent_Guru -c pyproject.toml -f screen

      - name: bandit - machine-readable report
        if: always()
        run: bandit -r Agent_Guru -c pyproject.toml -f json -o bandit.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate 2b - known-vulnerable dependencies.
  #
  # What this replaced, and why. The old step was
  #   pip-audit -r requirements-lock.txt ... || true
  # with the JSON uploaded as an artifact. Nobody opened the artifact, and
  # `|| true` meant the step could not fail, so 145 Dependabot alerts
  # (7 critical, 57 high) built up with no human ever seeing one. The same
  # `|| true` hid that the audit never worked: it made pip resolve the whole
  # Windows-frozen lock, and it skipped torch, torchvision and torchaudio as
  # "not found on PyPI" because the lock pins +cu128 builds. The triage is in
  # docs/security/dependency-triage-2026-09.md.
  #
  # What it does now (scripts/dependency_audit.py):
  #   * Audits requirements-lock.txt and requirements-torch.txt pin by pin.
  #     Those are the only files with exact pins, so they are exactly what
  #     Dependabot alerts on.
  #   * FAILS on a critical or high advisory that nobody has accepted. That
  #     includes a newly published one against a dependency this pull request
  #     did not touch. That is deliberate: finding out when the advisory
  #     appears, not months later, is the point. Clearing it takes one of
  #     two small, reviewable changes: upgrade, or add an entry to
  #     .github/dependency-audit-accepted.toml saying why the code is not
  #     reachable, with a review-by date at most a year out.
  #   * NEVER fails on moderate or low. They are listed in the job summary.
  #     Failing on all of them is how an audit gets ignored within a week.
  #   * FAILS if the audit itself did not complete: a package pip-audit
  #     skipped, fewer packages audited than pinned, or a severity that
  #     could not be looked up. A check that could not run must not look
  #     like a check that passed.
  #   * Puts the result where it will be read: a one-line headline and
  #     tables in the job summary, an error annotation for each blocking
  #     finding, and, on the weekly scheduled run, a GitHub issue labelled
  #     dependency-audit. The issue is opened on the first failure, commented
  #     on each week while it stays unresolved, and closed when the audit is
  #     clean. Advisories are published without any push, so without the
  #     weekly run a new critical could sit unseen until the next pull request.
  #
  # Runs on every event, the schedule included, and "CI status" requires it
  # on pushes and pull requests. It takes well under a minute: pinned files
  # with --no-deps need no resolver and no install.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Security - dependency audit (blocking on critical/high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the scheduled run writes. It opens, comments on or closes the
      # dependency-audit tracking issue.
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install audit tooling
        run: pip install "pip-audit>=2.9,<3" pytest

      # The script decides whether CI is red, so its own failure modes are
      # tested before its answer is trusted.
      - name: Self-test the audit script
        # --noconftest: the root conftest.py imports hypothesis, which these
        # tests do not need and this job does not install.
        run: python -m pytest --noconftest -p no:cacheprovider -o addopts="" -q scripts/tests/test_dependency_audit.py

      - name: pip-audit - pinned dependencies (blocking on critical/high)
        id: audit
        run: python scripts/dependency_audit.py requirements-lock.txt requirements-torch.txt

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit/
          retention-days: 30

      - name: Open, update or close the tracking issue (scheduled run only)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          label=dependency-audit
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The scheduled dependency audit on $(date -u +%F) found nothing that needs a decision. Closing. Run: $run_url"
            fi
            exit 0
          fi

          if [ -f dependency-audit/report.md ]; then
            cp dependency-audit/report.md issue.md
          else
            echo "The audit step ($OUTCOME) failed before it wrote a report. Read the job log." > issue.md
          fi
          printf '\n\nRun: %s\n' "$run_url" >> issue.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh label create "$label" --color B60205 --description "Opened by the scheduled dependency audit" --force
            gh issue create --label "$label" --body-file issue.md \
              --title "Dependency audit: critical or high findings need a decision"
          fi

  # ---------------------------------------------------------------------------
  # Gate 3 - the actual test suite.
  # Blocking on Linux across the declared Python range, on every push and
  # pull request. Windows and macOS, which the README also calls
  # production-ready, run in the platform run (weekly and on demand); see
  # the cost note at the top of this file.
  #
  # The Windows and macOS legs are not a gate. The suite had never run in
  # CI until 2026-09-24 (a UTF-8 BOM in
  # pyproject.toml broke every install). Its first full runs pass about 4,870
  # of 4,950 tests on Linux. Windows and macOS also have outstanding
  # platform-specific failures: pywin32 is not declared as a dependency,
  # SQLite files are still open when test fixtures delete them (95+ teardown
  # errors on Windows), and several timing-sensitive tests fail on slower
  # runners. Those are real findings, tracked as separate work, not noise.
  #
  # They used to run on every pull request with continue-on-error, so a
  # failure showed red on the leg but never failed the run or the "CI status"
  # gate. In the platform run nothing is gated, so continue-on-error is
  # dropped there: a platform failure now fails that run, which is what makes
  # GitHub report a failed scheduled run. Every Linux leg, lint and security
  # still block pull requests exactly as before.
  # ---------------------------------------------------------------------------
  test:
    name: pytest - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Gate run: Linux on the full declared Python range.
        # Platform run: Windows, the platform pyproject.toml classifies, on
        # the same range, and macOS on the newest version. The README claims
        # all three are production ready, so they are tested, not assumed.
        include: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '[{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.13"}]'
          || '[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"}]'
          ) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      # sounddevice binds PortAudio at import time. Windows wheels ship the
      # DLL; Linux and macOS do not, and without it eight test modules fail
      # to import with OSError: PortAudio library not found - a collection
      # error, not a skip.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      # The suite imports torch for real. Installing it from PyPI on a GPU-less
      # runner drags in ~2.5 GB of CUDA wheels that will never be used, so the
      # CPU index goes first and wins the resolution.
      #
      # torch and torchvision MUST come from the same index, in the same
      # command. torchvision ships compiled ops built against one specific
      # torch build. If only torch comes from the CPU index, the test extra
      # below pulls torchvision from PyPI, and pip accepts the pair because
      # "2.14.0+cpu" satisfies "torch==2.14.0". On Linux the PyPI torchvision
      # is built against the CUDA torch, so its ops never register and any
      # import of torchvision (including transitively via transformers and
      # sentence-transformers) fails with
      # "RuntimeError: operator torchvision::nms does not exist".
      - name: Install PyTorch and torchvision (CPU build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and declared test dependencies
        run: pip install -e ".[test]"

      # faster-whisper is listed in requirements.txt but not in pyproject.toml,
      # so the step above never installed it. Without it 42 speech-to-text
      # tests failed on every platform with "faster-whisper could not be
      # imported", masking every other result in speech/. The tests use the
      # "tiny" Whisper model (~75 MB), fetched from Hugging Face on first use
      # and kept by the cache step below.
      - name: Install speech-to-text dependency (faster-whisper)
        run: pip install "faster-whisper>=0.9.0"

      - name: Record the resolved environment
        run: |
          python -VV
          pip freeze > pip-freeze-${{ matrix.os }}-${{ matrix.python-version }}.txt

      # Several tests exercise a real sentence-transformers model. Caching the
      # HuggingFace directory turns a ~90 MB download into a cache hit.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      # Collection is checked on its own so that an import error is reported
      # as an import error, not buried among test failures.
      - name: Collect the test suite
        run: pytest --collect-only -q

      - name: Run the test suite
        run: >
          pytest
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
          --cov=Agent_Guru
          --cov-report=xml:coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml
          --cov-report=term-missing:skip-covered

      # Kept deliberately: the hand-written functional script the previous CI
      # ran. pytest replaces nothing here, it adds to it.
      - name: Functional checks (scripts/test_all.py)
        if: always()
        run: python scripts/test_all.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage-*.xml
            pip-freeze-*.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # A single check to require on the branch, so the protection rule does not
  # have to enumerate every matrix leg. Gate run only: in the platform run the
  # lint and security jobs are skipped, which this check would read as failed.
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint-errors, security, dependency-audit, test]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "lint-errors:      ${{ needs.lint-errors.result }}"
          echo "security:         ${{ needs.security.result }}"
          echo "dependency-audit: ${{ needs.dependency-audit.result }}"
          echo "test:             ${{ needs.test.result }}"
          if [ "${{ needs.lint-errors.result }}" != "success" ] \
          || [ "${{ needs.security.result }}" != "success" ] \
          || [ "${{ needs.dependency-audit.result }}" != "success" ] \
          || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required CI job failed."
            exit 1
          fi
