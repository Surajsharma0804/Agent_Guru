name: Agent Guru CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install dependencies, skipping platform-specific packages that aren't needed in CI
        pip install -r requirements-cpu.txt --no-deps
        # Now install all dependencies except platform-specific ones
        pip install torch>=2.0.0 torchvision>=0.15.0 torchaudio>=2.0.0
        pip install onnxruntime>=1.15.0 onnx>=1.14.0 onnxscript>=0.6.0
        pip install opencv-python>=4.8.0 opencv-contrib-python>=4.8.0 insightface>=0.7.3 pillow>=10.0.0
        pip install "numpy>=1.24.0,<2.0.0" scikit-learn>=1.3.0 scipy>=1.11.0 pandas>=2.0.0
        pip install librosa>=0.10.0 soundfile>=0.12.0 webrtcvad>=2.0.10
        pip install openai-whisper>=20230314 faster-whisper>=0.9.0
        pip install transformers>=4.30.0 tokenizers>=0.13.0 sentencepiece>=0.1.99
        pip install openai>=1.0.0 google-generativeai>=0.3.0 anthropic>=0.7.0
        pip install pydantic>=2.0.0 pydantic-settings>=2.0.0 python-dotenv>=1.0.0 pyyaml>=6.0.0 toml>=0.10.2
        pip install loguru>=0.7.0 tqdm>=4.65.0 rich>=13.0.0
        pip install pytest>=7.4.0 pytest-asyncio>=0.21.0 pytest-cov>=4.1.0 pytest-timeout>=2.1.0
        pip install black>=23.0.0 isort>=5.12.0 flake8>=6.0.0 mypy>=1.4.0 pylint>=2.17.0
        pip install types-pyyaml>=6.0.0 types-requests>=2.31.0
        pip install psutil>=5.9.0
        pip install cryptography>=41.0.0 pyjwt>=2.8.0
        pip install sqlalchemy>=2.0.0 aiosqlite>=0.19.0
        pip install httpx>=0.24.0 aiohttp>=3.8.0 requests>=2.31.0
        # Skip: pywin32, pyobjc-framework-Cocoa, pyobjc-framework-Quartz, dbus-python, pyaudio
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Code Formatting Check
      run: |
        black --check . || echo "⚠️ Code formatting issues found, but continuing..."
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type Check with mypy
      run: |
        mypy Agent_Guru --ignore-missing-imports || true
    
    - name: Run Tests
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term || echo "⚠️ No tests found yet, continuing..."
    
    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
    
    - name: Verify Project Structure
      run: |
        echo "Verifying Python project structure..."
        python -c "import sys; print(f'Python {sys.version}')"
        
        echo "Checking Agent_Guru package structure..."
        if [ -d "Agent_Guru" ]; then
          echo "✓ Agent_Guru main package exists"
          
          for module in speech vision llm platform agents memory deployment policy security avatar; do
            if [ -d "Agent_Guru/$module" ]; then
              echo "✓ Agent_Guru.$module exists"
            else
              echo "✗ Agent_Guru.$module missing"
              exit 1
            fi
          done
        else
          echo "✗ Agent_Guru package missing"
          exit 1
        fi
        
        echo "All modules verified successfully!"
    
    - name: Check Dependencies
      run: |
        echo "Checking requirements files..."
        if [ -f "requirements.txt" ]; then
          echo "✓ requirements.txt found"
          cat requirements.txt
        fi
        if [ -f "requirements-cpu.txt" ]; then
          echo "✓ requirements-cpu.txt found"
        fi
        if [ -f "pyproject.toml" ]; then
          echo "✓ pyproject.toml found"
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Install Core Dependencies
      run: |
        # Install core dependencies for security scanning, skip platform-specific packages
        pip install torch>=2.0.0 torchvision>=0.15.0 torchaudio>=2.0.0
        pip install onnxruntime>=1.15.0 onnx>=1.14.0
        pip install opencv-python>=4.8.0 pillow>=10.0.0
        pip install "numpy>=1.24.0,<2.0.0" scikit-learn>=1.3.0
        pip install transformers>=4.30.0
        pip install openai>=1.0.0 google-generativeai>=0.3.0 anthropic>=0.7.0
        pip install pydantic>=2.0.0 cryptography>=41.0.0
    
    - name: Check Dependencies for Vulnerabilities
      run: |
        safety check --json || true
    
    - name: Run Bandit Security Scan
      run: |
        bandit -r Agent_Guru -f json -o bandit-report.json || true
        bandit -r Agent_Guru -ll || true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: always()
    
    steps:
    - name: Check Status
      run: |
        echo "CI Pipeline Status:"
        echo "- Test: ${{ needs.test.result }}"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Security: ${{ needs.security.result }}"
        
        echo "✅ CI Pipeline Completed"
        echo "Note: Project is in initial setup phase with specifications complete"
