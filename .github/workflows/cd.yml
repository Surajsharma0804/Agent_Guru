name: Agent Guru CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME comes from github.repository which may have mixed case.
  # Docker registry paths must be lowercase — we lowercase it in each job
  # that builds/pushes images using the `image-name-lower` step.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Docker registry paths must be lowercase — convert here once
    - name: Lowercase image name
      id: image_name
      run: echo "value=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.version }}

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      continue-on-error: true
      with:
        image: ${{ steps.meta.outputs.tags }}
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: sbom
        path: sbom.spdx.json
        retention-days: 90
        if-no-files-found: warn

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    # Only run on pushes to main — not on PRs or tag pushes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.agent-guru.example.com

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Guard: skip all kubectl steps when the cluster secret isn't configured.
    # This prevents the job from failing in forks or repos that haven't set
    # up a real Kubernetes cluster yet.
    - name: Check Kubernetes credentials
      id: kube_check
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠️  KUBE_CONFIG_STAGING secret not set — skipping cluster deployment."
          echo "    Configure the secret to enable real Kubernetes deployments."
        fi

    - name: Set up kubectl
      if: steps.kube_check.outputs.available == 'true'
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure Kubernetes Context
      if: steps.kube_check.outputs.available == 'true'
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Blue-Green Deployment - Create Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        # Determine current active color (default to blue on first deploy)
        CURRENT_COLOR=$(kubectl get service agent-guru-reasoning \
          -n agent-guru-staging \
          -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo "blue")
        NEW_COLOR=$([ "$CURRENT_COLOR" == "blue" ] && echo "green" || echo "blue")

        echo "Current active: $CURRENT_COLOR → deploying to: $NEW_COLOR"
        echo "NEW_COLOR=$NEW_COLOR"       >> $GITHUB_ENV
        echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV

        # Update or create the deployment for the new color
        kubectl set image deployment/agent-guru-reasoning-$NEW_COLOR \
          reasoning=${{ needs.build-docker.outputs.image-tag }} \
          -n agent-guru-staging 2>/dev/null || \
        kubectl create deployment agent-guru-reasoning-$NEW_COLOR \
          --image=${{ needs.build-docker.outputs.image-tag }} \
          -n agent-guru-staging

        kubectl patch deployment agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-staging \
          -p '{"spec":{"template":{"metadata":{"labels":{"color":"'$NEW_COLOR'"}}}}}'

        kubectl rollout status deployment/agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-staging \
          --timeout=5m

    - name: Run Smoke Tests on Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        echo "Running smoke tests against $NEW_COLOR environment..."

        POD_IP=$(kubectl get pods -n agent-guru-staging \
          -l color=$NEW_COLOR \
          -o jsonpath='{.items[0].status.podIP}')

        kubectl run smoke-test-$NEW_COLOR --rm -i --restart=Never \
          --image=curlimages/curl:latest \
          -n agent-guru-staging \
          -- curl -f http://$POD_IP:8000/health || exit 1

        kubectl run smoke-test-metrics-$NEW_COLOR --rm -i --restart=Never \
          --image=curlimages/curl:latest \
          -n agent-guru-staging \
          -- curl -f http://$POD_IP:8000/metrics || exit 1

        echo "✅ Smoke tests passed on $NEW_COLOR environment"

    - name: Switch Traffic to Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl patch service agent-guru-reasoning \
          -n agent-guru-staging \
          -p '{"spec":{"selector":{"color":"'$NEW_COLOR'"}}}'
        echo "✅ Traffic switched to $NEW_COLOR"

    - name: Verify Deployment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl get pods    -n agent-guru-staging -l color=$NEW_COLOR
        kubectl get services -n agent-guru-staging -l app=agent-guru-reasoning
        sleep 30
        # Only curl the real endpoint when it's actually reachable
        curl -f https://staging.agent-guru.example.com/health || \
          echo "⚠️  External health check skipped (endpoint not yet configured)"
        echo "✅ Deployment verified"

    - name: Cleanup Old Environment
      if: steps.kube_check.outputs.available == 'true' && success()
      run: |
        kubectl scale deployment agent-guru-reasoning-$CURRENT_COLOR \
          -n agent-guru-staging --replicas=1 || true

    - name: Rollback on Failure
      if: steps.kube_check.outputs.available == 'true' && failure()
      run: |
        echo "❌ Deployment failed, rolling back to $CURRENT_COLOR..."
        kubectl patch service agent-guru-reasoning \
          -n agent-guru-staging \
          -p '{"spec":{"selector":{"color":"'$CURRENT_COLOR'"}}}'
        kubectl delete deployment agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-staging || true
        echo "❌ Rollback completed"
        exit 1

    - name: Skipped — no Kubernetes cluster configured
      if: steps.kube_check.outputs.available == 'false'
      run: |
        echo "ℹ️  Staging deployment skipped: KUBE_CONFIG_STAGING secret not set."
        echo "    Docker image was built and pushed successfully."
        echo "    Set KUBE_CONFIG_STAGING in repo secrets to enable cluster deployment."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://agent-guru.example.com

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check Kubernetes credentials
      id: kube_check
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠️  KUBE_CONFIG_PRODUCTION secret not set — skipping cluster deployment."
        fi

    - name: Set up kubectl
      if: steps.kube_check.outputs.available == 'true'
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure Kubernetes Context
      if: steps.kube_check.outputs.available == 'true'
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Create Deployment Backup
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl get deployment agent-guru-reasoning-blue  -n agent-guru-production -o yaml > deployment-blue-backup.yaml  || true
        kubectl get deployment agent-guru-reasoning-green -n agent-guru-production -o yaml > deployment-green-backup.yaml || true
        kubectl get service    agent-guru-reasoning       -n agent-guru-production -o yaml > service-backup.yaml

    - name: Blue-Green Deployment - Create Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        CURRENT_COLOR=$(kubectl get service agent-guru-reasoning \
          -n agent-guru-production \
          -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo "blue")
        NEW_COLOR=$([ "$CURRENT_COLOR" == "blue" ] && echo "green" || echo "blue")

        echo "Current active: $CURRENT_COLOR → deploying to: $NEW_COLOR"
        echo "NEW_COLOR=$NEW_COLOR"         >> $GITHUB_ENV
        echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV

        kubectl set image deployment/agent-guru-reasoning-$NEW_COLOR \
          reasoning=${{ needs.build-docker.outputs.image-tag }} \
          -n agent-guru-production 2>/dev/null || \
        kubectl create deployment agent-guru-reasoning-$NEW_COLOR \
          --image=${{ needs.build-docker.outputs.image-tag }} \
          --replicas=3 \
          -n agent-guru-production

        kubectl patch deployment agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-production \
          -p '{"spec":{"template":{"metadata":{"labels":{"color":"'$NEW_COLOR'","app":"agent-guru-reasoning"}}}}}'

        kubectl rollout status deployment/agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-production \
          --timeout=10m

    - name: Run Comprehensive Smoke Tests on Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        POD_IPS=$(kubectl get pods -n agent-guru-production \
          -l color=$NEW_COLOR \
          -o jsonpath='{.items[*].status.podIP}')

        for POD_IP in $POD_IPS; do
          kubectl run smoke-test-health-$NEW_COLOR-$(date +%s) --rm -i --restart=Never \
            --image=curlimages/curl:latest -n agent-guru-production \
            -- curl -f http://$POD_IP:8000/health || exit 1

          kubectl run smoke-test-metrics-$NEW_COLOR-$(date +%s) --rm -i --restart=Never \
            --image=curlimages/curl:latest -n agent-guru-production \
            -- curl -f http://$POD_IP:8000/metrics || exit 1

          kubectl run smoke-test-reasoning-$NEW_COLOR-$(date +%s) --rm -i --restart=Never \
            --image=curlimages/curl:latest -n agent-guru-production \
            -- curl -f -X POST http://$POD_IP:8000/api/v1/reason \
               -H "Content-Type: application/json" \
               -d '{"input":"test query","user_id":"smoke-test"}' || exit 1

          echo "✅ Pod $POD_IP passed all smoke tests"
        done

    - name: Switch Traffic to Green Environment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl patch service agent-guru-reasoning \
          -n agent-guru-production \
          -p '{"spec":{"selector":{"color":"'$NEW_COLOR'"}}}'
        echo "✅ Traffic switched to $NEW_COLOR"
        sleep 60

    - name: Run Health Checks
      if: steps.kube_check.outputs.available == 'true'
      run: |
        for i in {1..5}; do
          curl -f https://agent-guru.example.com/health && \
            echo "✅ Health check $i passed" || { echo "❌ Health check $i failed"; exit 1; }
          sleep 10
        done

    - name: Run Production Smoke Tests
      if: steps.kube_check.outputs.available == 'true'
      run: |
        curl -f https://agent-guru.example.com/metrics || exit 1
        curl -f -X POST https://agent-guru.example.com/api/v1/reason \
          -H "Content-Type: application/json" \
          -d '{"input":"production smoke test","user_id":"smoke-test"}' || exit 1
        echo "✅ Production smoke tests passed"

    - name: Verify Deployment
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl get pods     -n agent-guru-production -l color=$NEW_COLOR
        kubectl get services -n agent-guru-production -l app=agent-guru-reasoning
        echo "✅ Production deployment verified"

    - name: Cleanup Old Environment
      if: steps.kube_check.outputs.available == 'true' && success()
      run: |
        kubectl scale deployment agent-guru-reasoning-$CURRENT_COLOR \
          -n agent-guru-production --replicas=1 || true

    - name: Rollback on Failure
      if: steps.kube_check.outputs.available == 'true' && failure()
      run: |
        echo "❌ Production deployment failed, rolling back to $CURRENT_COLOR..."
        kubectl patch service agent-guru-reasoning \
          -n agent-guru-production \
          -p '{"spec":{"selector":{"color":"'$CURRENT_COLOR'"}}}'
        kubectl scale deployment agent-guru-reasoning-$CURRENT_COLOR \
          -n agent-guru-production --replicas=3 || true
        kubectl delete deployment agent-guru-reasoning-$NEW_COLOR \
          -n agent-guru-production || true
        [ -f "deployment-$CURRENT_COLOR-backup.yaml" ] && \
          kubectl apply -f deployment-$CURRENT_COLOR-backup.yaml || true
        echo "❌ Rollback completed"
        exit 1

    - name: Create GitHub Release
      if: steps.kube_check.outputs.available == 'true' && success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## Agent Guru Release ${{ github.ref_name }}

          ### Deployment Information
          - Docker Image: ${{ needs.build-docker.outputs.image-tag }}
          - Digest: ${{ needs.build-docker.outputs.image-digest }}
          - Deployed to Production: ${{ github.event.head_commit.timestamp }}

          ### Changes
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false

    - name: Skipped — no Kubernetes cluster configured
      if: steps.kube_check.outputs.available == 'false'
      run: |
        echo "ℹ️  Production deployment skipped: KUBE_CONFIG_PRODUCTION secret not set."
        echo "    Set KUBE_CONFIG_PRODUCTION in repo secrets to enable cluster deployment."

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-docker, deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install aiohttp structlog

    - name: Determine Deployment Status
      id: status
      env:
        STAGING_RESULT: ${{ needs.deploy-staging.result }}
        PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
      run: |
        echo "staging_status=$STAGING_RESULT"     >> $GITHUB_OUTPUT
        echo "production_status=$PRODUCTION_RESULT" >> $GITHUB_OUTPUT

    - name: Send Staging Success Notification
      if: needs.deploy-staging.result == 'success' && secrets.SLACK_WEBHOOK_URL != ''
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GH_ACTOR: ${{ github.actor }}
      run: |
        python -c "
        import asyncio, os, sys
        sys.path.insert(0, '.')
        from Agent_Guru.reasoning.deployment.notifications import send_deployment_success
        asyncio.run(send_deployment_success(
            environment='staging',
            version=os.environ['GH_REF_NAME'],
            commit_sha=os.environ['GH_SHA'],
            commit_message=os.environ['GH_COMMIT_MESSAGE'],
            deployer=os.environ['GH_ACTOR'],
            duration_seconds=0,
        ))
        "

    - name: Send Staging Failure Notification
      if: needs.deploy-staging.result == 'failure' && secrets.SLACK_WEBHOOK_URL != ''
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GH_ACTOR: ${{ github.actor }}
      run: |
        python -c "
        import asyncio, os, sys
        sys.path.insert(0, '.')
        from Agent_Guru.reasoning.deployment.notifications import send_deployment_failure
        asyncio.run(send_deployment_failure(
            environment='staging',
            version=os.environ['GH_REF_NAME'],
            commit_sha=os.environ['GH_SHA'],
            commit_message=os.environ['GH_COMMIT_MESSAGE'],
            deployer=os.environ['GH_ACTOR'],
            duration_seconds=0,
            error_message='Staging deployment failed. Check logs for details.',
        ))
        "

    - name: Send Production Success Notification
      if: needs.deploy-production.result == 'success' && secrets.SLACK_WEBHOOK_URL != ''
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GH_ACTOR: ${{ github.actor }}
      run: |
        python -c "
        import asyncio, os, sys
        sys.path.insert(0, '.')
        from Agent_Guru.reasoning.deployment.notifications import send_deployment_success
        asyncio.run(send_deployment_success(
            environment='production',
            version=os.environ['GH_REF_NAME'],
            commit_sha=os.environ['GH_SHA'],
            commit_message=os.environ['GH_COMMIT_MESSAGE'],
            deployer=os.environ['GH_ACTOR'],
            duration_seconds=0,
        ))
        "

    - name: Send Production Failure Notification
      if: needs.deploy-production.result == 'failure' && secrets.SLACK_WEBHOOK_URL != ''
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GH_ACTOR: ${{ github.actor }}
      run: |
        python -c "
        import asyncio, os, sys
        sys.path.insert(0, '.')
        from Agent_Guru.reasoning.deployment.notifications import send_deployment_failure
        asyncio.run(send_deployment_failure(
            environment='production',
            version=os.environ['GH_REF_NAME'],
            commit_sha=os.environ['GH_SHA'],
            commit_message=os.environ['GH_COMMIT_MESSAGE'],
            deployer=os.environ['GH_ACTOR'],
            duration_seconds=0,
            error_message='Production deployment failed. Check logs for details.',
        ))
        "

    - name: Summary
      env:
        STAGING_STATUS: ${{ steps.status.outputs.staging_status }}
        PRODUCTION_STATUS: ${{ steps.status.outputs.production_status }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_ACTOR: ${{ github.actor }}
        GH_IMAGE_TAG: ${{ needs.build-docker.outputs.image-tag }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_REPOSITORY: ${{ github.repository }}
      run: |
        echo "## Deployment Summary"                                          >> $GITHUB_STEP_SUMMARY
        echo ""                                                               >> $GITHUB_STEP_SUMMARY
        case "$STAGING_STATUS" in
          success) echo "✅ **Staging**: Deployed successfully"               >> $GITHUB_STEP_SUMMARY ;;
          failure) echo "❌ **Staging**: Deployment failed"                   >> $GITHUB_STEP_SUMMARY ;;
          skipped) echo "⏭️ **Staging**: Skipped"                             >> $GITHUB_STEP_SUMMARY ;;
        esac
        case "$PRODUCTION_STATUS" in
          success) echo "✅ **Production**: Deployed successfully"            >> $GITHUB_STEP_SUMMARY ;;
          failure) echo "❌ **Production**: Deployment failed"                >> $GITHUB_STEP_SUMMARY ;;
          skipped) echo "⏭️ **Production**: Skipped"                          >> $GITHUB_STEP_SUMMARY ;;
        esac
        echo ""                                                               >> $GITHUB_STEP_SUMMARY
        echo "### Details"                                                    >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $GH_REF_NAME"                                   >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: $GH_SHA"                                         >> $GITHUB_STEP_SUMMARY
        echo "- **Deployer**: $GH_ACTOR"                                     >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: $GH_IMAGE_TAG"                                    >> $GITHUB_STEP_SUMMARY
        echo "- [Logs](https://github.com/$GH_REPOSITORY/actions/runs/$GH_RUN_ID)" >> $GITHUB_STEP_SUMMARY

  deploy-rollback-monitor:
    name: Deploy Rollback Monitor
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Docker registry paths must be fully lowercase — github.repository can
    # contain uppercase letters (e.g. "Surajsharma0804/Agent_Guru").
    - name: Lowercase image name
      id: image_name
      run: echo "value=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Build and Push Rollback Monitor Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Agent_Guru/reasoning/deployment/Dockerfile.rollback-monitor
        push: true
        # Use the lowercased repo name + a fixed sub-path for the monitor image
        tags: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}/rollback-monitor:latest,${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}/rollback-monitor:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Guard: only deploy to the cluster when the secret is configured
    - name: Check Kubernetes credentials
      id: kube_check
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠️  KUBE_CONFIG_PRODUCTION not set — skipping cluster deployment."
        fi

    - name: Set up kubectl
      if: steps.kube_check.outputs.available == 'true'
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure Kubernetes Context
      if: steps.kube_check.outputs.available == 'true'
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Deploy Rollback Monitor
      if: steps.kube_check.outputs.available == 'true'
      run: |
        kubectl apply -f k8s/rollback-monitor.yaml
        kubectl rollout restart deployment/rollback-monitor -n agent-guru-production
        kubectl rollout status  deployment/rollback-monitor -n agent-guru-production --timeout=2m
        echo "✅ Rollback monitor deployed"

    - name: Skipped — no Kubernetes cluster configured
      if: steps.kube_check.outputs.available == 'false'
      run: |
        echo "ℹ️  Rollback monitor image built and pushed successfully."
