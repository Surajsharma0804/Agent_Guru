name: Agent Guru Project Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  project-audit:
    name: Project Structure Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Audit Project Structure
      run: |
        echo "# Agent Guru Project Audit Report" > audit_report.md
        echo "" >> audit_report.md
        echo "## Project Overview" >> audit_report.md
        echo "- Repository: Agent_Guru" >> audit_report.md
        echo "- Language: Python 3.10+" >> audit_report.md
        echo "- Architecture: Python-First AI/ML" >> audit_report.md
        echo "" >> audit_report.md
        
        echo "## Module Structure" >> audit_report.md
        if [ -d "Agent_Guru" ]; then
          echo "- ✅ Agent_Guru (main package)" >> audit_report.md
          
          for module in speech vision llm platform agents memory deployment policy security avatar; do
            if [ -d "Agent_Guru/$module" ]; then
              echo "  - ✅ Agent_Guru.$module" >> audit_report.md
              file_count=$(find "Agent_Guru/$module" -type f -name "*.py" | wc -l)
              echo "    - Python files: $file_count" >> audit_report.md
            else
              echo "  - ❌ Agent_Guru.$module (missing)" >> audit_report.md
            fi
          done
        else
          echo "- ❌ Agent_Guru package (missing)" >> audit_report.md
        fi
        
        echo "" >> audit_report.md
        echo "## Specifications" >> audit_report.md
        if [ -d ".kiro/specs" ]; then
          spec_count=$(find .kiro/specs -type f -name "*.md" | wc -l)
          echo "- ✅ Specifications directory exists" >> audit_report.md
          echo "- Specification files: $spec_count" >> audit_report.md
        else
          echo "- ❌ Specifications directory missing" >> audit_report.md
        fi
        
        echo "" >> audit_report.md
        echo "## Configuration Files" >> audit_report.md
        for file in pyproject.toml requirements.txt requirements-cpu.txt README.md; do
          if [ -f "$file" ]; then
            echo "- ✅ $file" >> audit_report.md
          else
            echo "- ❌ $file (missing)" >> audit_report.md
          fi
        done
        
        echo "" >> audit_report.md
        echo "## Code Statistics" >> audit_report.md
        echo "- Total Python files: $(find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | wc -l)" >> audit_report.md
        echo "- Total lines of code: $(find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" -exec wc -l {} + | tail -1 | awk '{print $1}')" >> audit_report.md
        
        cat audit_report.md
    
    - name: Upload Audit Report
      uses: actions/upload-artifact@v4
      with:
        name: audit-report
        path: audit_report.md
        retention-days: 90
    
    - name: Verify Specifications
      run: |
        echo "Verifying specifications completeness..."
        
        required_specs=(
          ".kiro/specs/README.md"
          ".kiro/specs/VERIFICATION_COMPLETE.md"
          ".kiro/specs/guru-speech-engine/requirements.md"
          ".kiro/specs/guruvision-facial-recognition/requirements.md"
          ".kiro/specs/guru-llm-runtime/requirements.md"
          ".kiro/specs/guru-platform-integration/requirements.md"
        )
        
        all_found=true
        for spec in "${required_specs[@]}"; do
          if [ -f "$spec" ]; then
            echo "✓ $spec"
          else
            echo "✗ $spec (missing)"
            all_found=false
          fi
        done
        
        if [ "$all_found" = true ]; then
          echo "All required specifications found!"
        else
          echo "⚠️ Some specifications are missing, but continuing..."
        fi
    
    - name: Check Documentation
      run: |
        echo "Checking documentation files..."
        
        docs=(
          "README.md"
          "FINAL_STATUS.md"
          "LANGUAGE_ARCHITECTURE.md"
          "GPU_SETUP.md"
          "PROJECT_STATUS.md"
        )
        
        for doc in "${docs[@]}"; do
          if [ -f "$doc" ]; then
            echo "✓ $doc"
            lines=$(wc -l < "$doc")
            echo "  Lines: $lines"
          else
            echo "✗ $doc (missing)"
          fi
        done

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config
    
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
    
    - name: Audit Dependencies
      run: |
        echo "Auditing Python dependencies..."
        pip-audit -r requirements-cpu.txt --desc || echo "⚠️ pip-audit encountered issues, continuing..."
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config
    
    - name: Check for Outdated Packages
      run: |
        pip install -r requirements-cpu.txt
        pip list --outdated

  summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [project-audit, dependency-audit]
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "# Agent Guru Audit Summary" > summary.md
        echo "" >> summary.md
        echo "## Audit Results" >> summary.md
        echo "- Project Structure Audit: ${{ needs.project-audit.result }}" >> summary.md
        echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> summary.md
        echo "" >> summary.md
        echo "## Status" >> summary.md
        
        if [ "${{ needs.project-audit.result }}" = "success" ] && [ "${{ needs.dependency-audit.result }}" = "success" ]; then
          echo "✅ All audits passed successfully" >> summary.md
        else
          echo "⚠️ Some audits failed or were skipped" >> summary.md
        fi
        
        cat summary.md
    
    - name: Upload Summary
      uses: actions/upload-artifact@v4
      with:
        name: audit-summary
        path: summary.md
        retention-days: 90
