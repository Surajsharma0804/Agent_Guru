# Critical and high advisories that the dependency audit reports but does
# not fail on, because someone has decided, in writing, why the risk is
# acceptable.
#
# Why this file exists. Without it, the only choices are failing the build
# on every advisory, which people learn to ignore within a week, or never
# failing it, which is how 145 alerts built up unread. This file is the
# third option: a new critical or high finding fails CI until someone
# either upgrades or adds an entry here. Each entry is reviewed in a pull
# request like any other change.
#
# Rules, enforced by scripts/dependency_audit.py:
#   - `reason` says why the vulnerable code is not reachable, or why the
#     risk is acceptable. "No fix yet" on its own is not a reason.
#   - `review_by` is at most a year after `accepted_on`. Once it passes,
#     the finding blocks again, so the decision is made again instead of
#     going stale. Entries that match no finding are reported for deletion.
#   - Moderate and low never block, so they do not belong here.
#
# The reasoning behind each entry is in docs/security/dependency-triage-2026-09.md.

# --- No fixed release exists. Review sooner, to pick up the fix. -----------

