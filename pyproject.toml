[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guru"
version = "1.0.0"
description = "Agent_Guru - Production-grade AI voice assistant with Core Reasoning Engine"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Suraj Sharma"}]
requires-python = ">=3.11"
keywords = ["voice-assistant", "ai", "local", "privacy", "hinglish"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    # NOTE: openai and anthropic are NOT base dependencies. Agent_Guru is an
    # offline-first assistant; requiring two cloud API SDKs in every install
    # was pure weight and supply-chain surface for the majority of users, who
    # never send a request off the machine. They now live in the optional
    # `cloud` extra below. Nothing imports them at module scope outside
    # Agent_Guru/reasoning/llm/providers/{openai,anthropic}_provider.py, and
    # both of those are imported lazily inside functions, so a default install
    # imports cleanly without them.
    "transformers>=4.36.0",
    # Not 2.1: before 2.6.0, torch.load(weights_only=True) still executes code
    # from a crafted file (GHSA-53q9-r3pm-6pq6, critical). vision/training
    # loads user-supplied checkpoints with that call and relies on it being
    # safe, and pip keeps any installed torch that meets the floor.
    "torch>=2.6.0",
    # spacy is not a base dependency. Its only user,
    # reasoning/intent/ner_extractor.py, imports it inside a try block and
    # also needs a trained model under reasoning/models/ner_model that is not
    # shipped, so on every install it logged "spaCy model not found" and did
    # nothing while costing a large download. It lives in the test extra so
    # the NER extractor tests still run.
    "onnxruntime>=1.16.0",
    # The assistant's voice. It was listed only in requirements.txt and
    # requirements-cpu.txt, so `pip install -e .` and CI never installed it,
    # and the development venv only had it because it was created with
    # include-system-site-packages and borrowed the system Python's copy. On
    # a clean install Guru fell back to the pyttsx3 voice with a warning, or
    # to silence where pyttsx3 is missing too. Measured in a fresh venv:
    # this one package pulls in everything synthesis needs (espeakng-loader
    # ships the espeak-ng library, plus phonemizer-fork and onnxruntime). The
    # model itself is downloaded on first use by speech/tts/tts_engine.py.
    "kokoro-onnx>=0.5.0,<0.6",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "sentry-sdk>=1.39.0",
    # Everything below was missing from this list. The development venv was
    # created with include-system-site-packages and borrowed 478 packages
    # from the system Python, so nothing here was ever noticed. Measured in a
    # venv built from this file alone: main.py crashed at startup, and once
    # past that it reached "listening" with no speech recognition, no memory
    # and no way to answer a question.
    #
    # main.py crashed at startup without these two: security/crypto
    # (key_store, identity) and security/audit/logger.py import cryptography
    # at module scope, and speech/biometric/voice_features.py (speaker
    # recognition) imports scipy.signal at module scope.
    "cryptography>=41.0.0",
    "scipy>=1.11.0",
    # Imported unguarded at module scope by platform/process_manager.py and
    # the resource and health monitors; without it a subsystem failed on
    # every start.
    "psutil>=5.9.0",
    # The voice pipeline. sounddevice opens the microphone and plays speech,
    # faster-whisper turns speech into text (without it every wake word
    # ended in an error), silero-vad finds where speech starts and stops
    # (without it main.py falls back to a plain energy threshold), and the
    # ollama client is how llm/providers/ollama_adapter.py asks the local
    # model for every spoken answer.
    "sounddevice>=0.5.0",
    "faster-whisper>=0.9.0",
    "silero-vad>=5.1",
    "ollama>=0.4.0",
    # The offline voice of last resort: tts_engine.py uses it when Kokoro
    # cannot load, most often because its model has not been downloaded yet
    # on a machine with no network. Without it Guru answers in silence.
    "pyttsx3>=2.90",
    # Memory and reasoning. aiosqlite is imported unguarded by the memory
    # manager and the reasoning state store; without it conversation history
    # lived only in RAM and was lost on restart. chromadb is imported at
    # module scope by reasoning/memory/vector_db.py, and without it the whole
    # ReasoningEngine was disabled. aiohttp is imported at module scope by
    # ten modules, including the reasoning Ollama provider.
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "aiohttp>=3.8.0",
    # Memory search ranks past conversations by meaning with
    # reasoning/memory/embedding.py, which loads sentence-transformers inside
    # a try block. Without it memory_manager.py fell back to a 26-dim
    # letter-frequency vector, so "what did I say about my sister" matched
    # on spelling, not meaning. The development venv borrowed the system
    # Python's copy, which is why this was never seen.
    "sentence-transformers>=2.2.0",
    # speech/biometric/speaker_verifier.py uses librosa's MFCC features when
    # SpeechBrain is absent, which is always, since SpeechBrain is not
    # declared. Without librosa it had no backend at all and let every voice
    # through in full mode, so an owner who enrolled their voice lost that
    # protection on a clean install with only a log warning. Emotion
    # detection and avatar lip sync use it too.
    "librosa>=0.10.0",
    # Desktop control ("open Notepad", "type this", "turn the volume down").
    # pyautogui works on every desktop OS; pywin32 and pycaw exist only on
    # Windows, where the window and volume controllers need them.
    "pyautogui>=0.9.54",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=20230407; sys_platform == 'win32'",
    # Vision and the avatar. main.py loads the avatar, whose renderer
    # (avatar/rendering/renderer.py) opens its window with cv2.namedWindow and
    # cv2.imshow. Those exist only in the desktop build, so this is
    # opencv-python and not opencv-python-headless; the two ship the same cv2
    # module and must never be installed together. Pillow is used by
    # vision/ocr.py and vision/vqa.py. Both are imported inside functions or
    # try blocks, so without them startup logged no error and the camera
    # features and the avatar window simply never worked.
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    # insightface is deliberately not declared. vision/face_features.py and
    # vision/detection/detector.py fall back to stub embeddings and OpenCV's
    # Haar cascade without it, and it has never been installed in the
    # development venv either, so the InsightFace path has never run. It
    # also needs a C++ toolchain to build on Windows. Declaring it would
    # make every install depend on code nobody has exercised.
]

[project.urls]
Homepage = "https://github.com/Surajsharma0804/Agent_Guru"
Repository = "https://github.com/Surajsharma0804/Agent_Guru"
Changelog = "https://github.com/Surajsharma0804/Agent_Guru/blob/main/CHANGELOG.md"

[project.scripts]
agent-guru = "Agent_Guru.__main__:_run"

[project.optional-dependencies]
# Optional cloud LLM providers. The local Ollama provider is the default and
# needs nothing from here.
#   pip install agent-guru[cloud]
cloud = [
    "openai>=1.6.0",
    "anthropic>=0.8.0",
]

# Shared-state backends for running the reasoning service beside other
# services. A voice install never uses them: reasoning/state/redis_cache.py,
# reasoning/state/cloud_sync.py and reasoning/utils/connection_pool.py import
# redis and asyncpg inside try blocks and report clearly when they are
# missing. They used to be base dependencies, so every install pulled in a
# Redis client and a PostgreSQL driver it could not use.
#   pip install agent-guru[backends]
backends = [
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    # pytest.ini passes --timeout=30 in addopts, so pytest does not even
    # START without this plugin. It was declared in requirements.txt but not
    # here, which meant `pip install -e .[dev]` produced an environment that
    # could not run the project's own test configuration.
    "pytest-timeout>=2.1.0",
    "hypothesis>=6.92.0",
    # Agent_Guru/self_improvement/tests/{test_self_improvement_engine,
    # test_strategy_optimizer}.py request the `benchmark` fixture in 4 tests.
    # It was declared nowhere, so those 4 always errored at setup with
    # "fixture 'benchmark' not found" - the performance assertions they make
    # had never run.
    "pytest-benchmark>=4.0.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.6",
    "safety>=2.3.5",
    "types-PyYAML>=6.0.12",
]

# Everything the pytest suite needs in order to COLLECT and RUN. This list was
# derived by running the real suite and resolving every ModuleNotFoundError,
# not by guessing: with it, `pytest --collect-only` gathers the whole suite
# with no import errors except the Windows-only modules on non-Windows hosts.
#
# It deliberately omits four packages that requirements.txt / requirements-cpu
# list but that cannot be installed on a stock CI runner, and that no test
# imports: insightface and pyaudio need a C toolchain, onnxruntime-gpu has no
# wheel without CUDA, and dbus-python needs Linux system headers.
test = [
    "agent-guru[dev]",
    # Core runtime the suite touches
    "numpy>=1.24.0,<2.0.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
    "scipy>=1.11.0",
    "networkx>=3.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "fastapi>=0.104.0",
    # <3.1.60: config_writer() rewrites dormant values as live directives such
    # as core.hooksPath (GHSA-284h-m62q-gf8w, critical); git_integration.py
    # calls it on every TOKEN-auth push.
    "GitPython>=3.1.60",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "sentry-sdk>=1.39.0",
    # LLM provider clients
    "openai>=1.6.0",
    "anthropic>=0.8.0",
    # ML / speech / vision stack the tests exercise for real
    "torch>=2.6.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.2.0",
    "pytorch-lightning>=2.0.0",
    "nltk>=3.8.1",
    "chromadb>=0.4.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.5.0",
    # cv2 comes from opencv-python in the base list. This extra used to pin
    # opencv-python-headless instead, so CI would not need libGL.so.1, but
    # the headless build has no namedWindow/imshow, which the avatar renderer
    # needs, and the two distributions install the same cv2 module and
    # break each other when both are present. CI now installs libgl1 so the
    # desktop build imports on its Linux runners.
    #
    # spacy: the NER extractor tests skip themselves without it. See the
    # note in the base list for why it is no longer a base dependency.
    "spacy>=3.7.0",
    # Agent_Guru/vision/training/train.py imports torchvision.models.
    "torchvision>=0.21.0",
    # torch>=2.6 routes torch.onnx.export through the dynamo exporter, which
    # imports onnxscript. Agent_Guru/vision/training/export.py calls
    # torch.onnx.export, so without this the ONNX export feature raises
    # ModuleNotFoundError at runtime, not only in tests.
    "onnxscript>=0.1.0",
    # Agent_Guru/reasoning/tests/test_train_intent_classifier.py imports the
    # real training script, which imports nlpaug at module scope and
    # pytorch_lightning.loggers.TensorBoardLogger (which needs tensorboard).
    # Without these two the whole 58-test file fails to collect, so they belong
    # in the TEST extra and not only in the training extra below.
    "nlpaug>=1.1.11",
    "tensorboard>=2.15.0",
]

# Dependencies of the model-training entry points under
# Agent_Guru/reasoning/scripts/. These were previously declared ONLY in
# Agent_Guru/reasoning/requirements-training.txt, which nothing in the
# repository referenced - not the CI workflow, not the Dockerfile, not the
# docs, and not this file - so a fresh checkout could not run or test them.
#
# The list is the set of third-party modules those scripts actually import,
# verified against their import statements. It deliberately does NOT mirror
# requirements-training.txt wholesale: wandb, mlflow, optuna, ray[tune],
# albumentations, textaugment, adversarial-robustness-toolbox,
# focal-loss-torch, torch-pruning and onnxruntime-gpu are listed there but
# imported nowhere, and onnxruntime-gpu additionally has no wheel without
# CUDA, which would make this extra uninstallable on a stock machine.
training = [
    "agent-guru[test]",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "pytorch-lightning>=2.1.0",
    "transformers>=4.36.0",
    "tensorboard>=2.15.0",
    "nlpaug>=1.1.11",
    "nltk>=3.8.1",
    "gliner>=0.2.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "tqdm>=4.66.0",
    "GPUtil>=1.4.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
include = ["Agent_Guru*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatting ─────────────────────────────────────────────────────────
    "E501",    # line too long - handled by black (line-length = 100)
    "COM812",  # missing-trailing-comma - conflicts with ruff formatter

    # ── PLC0415: Import not at top-level (ARCHITECTURAL DECISION) ──────────
    # Agent_Guru uses intentional lazy imports for optional ML dependencies:
    # torch, faster-whisper, sounddevice, jnius, pyttsx3, insightface, vosk.
    # These are imported inside functions so the package loads cleanly on
    # machines missing optional deps. This is the standard Python pattern
    # for optional dependencies and is NOT a bug.
    # Violation count at baseline: 680 - all intentional.
    "PLC0415", # import-outside-toplevel

    # ── D: Docstrings (INCREMENTAL ENFORCEMENT) ─────────────────────────────
    # D107 suppressed globally - class docstrings cover __init__ semantics.
    # D102 (missing public method docstring): 231 violations - tracked backlog.
    # D101 (missing public class docstring): 82 violations - tracked backlog.
    # D104 (missing package docstring): 15 violations - tracked backlog.
    # D105 (missing magic method docstring): 45 violations - tracked backlog.
    # New code MUST have docstrings - these are legacy gaps.
    "D107",    # missing __init__ docstring - class docstring is sufficient
    "D101",    # missing public class docstring - legacy gap (82 violations)
    "D102",    # missing public method docstring - legacy gap (231 violations)
    "D103",    # missing public function docstring - legacy gap
    "D104",    # missing package docstring - legacy gap (15 violations)
    "D105",    # missing magic method docstring - legacy gap (45 violations)
    "D106",    # missing nested class docstring - legacy gap
    "D203",    # one-blank-line-before-class - conflicts with D211 (Google style)
    "D213",    # multi-line-summary-second-line - conflicts with D212
    "D205",    # 1 blank line required between summary and description - style
    "D401",    # first line imperative mood - too strict for this codebase
    "D415",    # first line should end with period - too strict
    "D417",    # missing argument descriptions in docstring - 40 violations

    # ── TRY: try/except structure (INCREMENTAL ENFORCEMENT) ────────────────
    # TRY300 (consider else): 340 violations - legacy pattern, fix incrementally
    # TRY301 (raise within try): 88 violations - legacy pattern
    # TRY401 (useless-try-except): 54 violations - legacy pattern
    # TRY203 (useless-try-except): 22 violations - legacy pattern
    # TRY004 (prefer-type-error): 11 violations - legacy pattern
    # TRY003/002/400: small counts - fix when touching those files
    # New code MUST use correct try/except/else structure.
    "TRY300",  # consider-else - legacy gap (340 violations)
    "TRY301",  # raise-within-try - legacy gap (88 violations)
    "TRY401",  # useless-try-except - legacy gap (54 violations)
    "TRY203",  # useless-try-except - legacy gap (22 violations)
    "TRY004",  # prefer-type-error - legacy gap (11 violations)
    "TRY003",  # raise-vanilla-args - legacy gap (2 violations)
    "TRY002",  # raise-vanilla-class - legacy gap (1 violation)
    "TRY400",  # error-instead-of-exception - legacy gap (1 violation)

    # ── BLE001: Blind except (INCREMENTAL ENFORCEMENT) ─────────────────────
    # 310 violations of `except Exception` without re-raise in callbacks/guards.
    # These are legitimate guard clauses that must not propagate exceptions
    # (e.g. alert callbacks, cleanup handlers, optional-dep fallbacks).
    # TRUE blind excepts (bare `except:`) are still forbidden.
    # Fix: narrow to specific exception types or add explicit logger.exception.
    "BLE001",  # blind-except - legacy gap (310 violations, fix incrementally)

    # ── FBT: Boolean traps (INCREMENTAL ENFORCEMENT) ─────────────────────
    # FBT001: 295 violations - public API methods with bool positional args
    # FBT002: 195 violations - bool default values
    # FBT003: 96 violations - bool literal in function call
    # Fix: use keyword-only args (*) or named constants (e.g. dry_run: bool = True)
    "FBT001",  # boolean positional arg - legacy gap (295 violations)
    "FBT002",  # boolean default value - legacy gap (195 violations)
    "FBT003",  # boolean literal in call - legacy gap (96 violations)

    # ── ARG: Unused arguments ────────────────────────────────────────────────
    # ARG001/002/003/004/005: Many overridden methods and callbacks intentionally
    # accept but do not use all parameters (Protocol conformance, ABC overrides).
    "ARG001",  # unused function argument - Protocol/ABC conformance
    "ARG002",  # unused method argument - 169 violations, overrides
    "ARG003",  # unused class method argument - overrides
    "ARG004",  # unused static method argument - overrides
    "ARG005",  # unused lambda argument - design choice

    # ── N999: Invalid module name (legacy file naming) ───────────────────────
    # 160 violations - existing module/package names use camelCase or mixed case
    # that predate this project's naming conventions. Renaming would break imports.
    "N999",    # invalid-module-name - legacy naming, renaming breaks imports

    # ── PLR0913: Too many arguments ──────────────────────────────────────────
    # 108 violations - AI pipeline classes legitimately need many config params.
    # Breaking into config objects would cause more complexity than it solves.
    "PLR0913", # too-many-arguments - legitimate for complex AI pipeline ctors

    # ── C901: Complex functions ───────────────────────────────────────────────
    # 96 violations - AI model routing, platform dispatch, and format converters
    # are inherently complex. Tracked in backlog for incremental refactoring.
    "C901",    # complex-structure - backlog item, fix incrementally

    # ── RUF002/003: Ambiguous unicode docstrings ─────────────────────────────
    # 95+24 violations - legitimate Unicode in docstring examples and emojis.
    "RUF002",  # ambiguous-unicode-character-docstring - legitimate unicode
    "RUF003",  # ambiguous-unicode-character-comment - legitimate unicode

    # ── RUF012: Mutable class attributes without ClassVar ────────────────────
    # 73 violations - Pydantic models and dataclasses handle mutability correctly.
    "RUF012",  # mutable-class-attributes - Pydantic/dataclass pattern

    # ── PERF401/402/403: Performance suggestions ─────────────────────────────
    # 68+1+1 violations - readability preferred over micro-optimisation here.
    "PERF401", # manual-list-comprehension - readability preferred
    "PERF402", # manual-list-copy - readability preferred
    "PERF403", # manual-dict-comprehension - readability preferred

    # ── SLF001: Private member access ────────────────────────────────────────
    # 62 violations - test helpers and internal coordination between sibling
    # classes within the same module legitimately access private members.
    "SLF001",  # private-member-access - test helpers and sibling access

    # ── G004/G202: Logging format string ─────────────────────────────────────
    # 54+18 violations - f-string logging is deliberate for structlog compatibility.
    "G004",    # logging-f-string - structlog pattern
    "G202",    # logging-warn-with-format - structlog pattern

    # ── PLW0603: Global statement ────────────────────────────────────────────
    # 53 violations - singleton initialization patterns use module-level globals.
    "PLW0603", # global-statement - singleton init pattern

    # ── PLR0911/0912/0915: Too many returns/branches/statements ──────────────
    # Complex dispatchers and state machines legitimately exceed these limits.
    "PLR0911", # too-many-return-statements - dispatcher pattern
    "PLR0912", # too-many-branches - state machine pattern
    "PLR0915", # too-many-statements - complex initialization

    # ── SIM102/105/108/112/117: Simplification suggestions ───────────────────
    # Stylistic preferences that reduce readability in complex conditional chains.
    "SIM102",  # collapsible-if - readability preferred
    "SIM105",  # suppressible-exception - contextlib.suppress preferred
    "SIM108",  # if-else-block-instead-of-ternary - readability
    "SIM112",  # use-capitalized-env-var - naming convention varies
    "SIM117",  # multiple-with-statements - readability preferred

    # ── ANN: Missing type annotations (INCREMENTAL) ───────────────────────────
    # ANN001/002/003: Missing parameter annotations in legacy code.
    # ANN201/202/204/205/206: Missing return annotations in legacy code.
    # ANN401: Any in public API - used deliberately in AI adapters.
    # New code MUST be fully annotated; these are legacy gaps.
    "ANN001",  # missing-type-function-argument - legacy gap
    "ANN002",  # missing-type-args - legacy gap
    "ANN003",  # missing-type-kwargs - legacy gap
    "ANN201",  # missing-return-type-public-function - legacy gap
    "ANN202",  # missing-return-type-private-function - legacy gap
    "ANN204",  # missing-return-type-special-method - legacy gap
    "ANN205",  # missing-return-type-static-method - legacy gap
    "ANN206",  # missing-return-type-class-method - legacy gap
    "ANN401",  # any-type - deliberate in AI adapters (dynamic types)

    # ── ASYNC: Async suggestions ──────────────────────────────────────────────
    # ASYNC109: async-function-with-timeout - trio-style, not applicable here.
    # ASYNC110: async-busy-wait - deliberate polling loops.
    # ASYNC220/221: create_subprocess_exec/shell - used with explicit await.
    "ASYNC109", # async-function-with-timeout - trio pattern, not used
    "ASYNC110", # async-busy-wait - deliberate polling
    "ASYNC220", # create-subprocess-exec - used correctly
    "ASYNC221", # create-subprocess-shell - used correctly

    # ── TD/FIX: TODO comments ─────────────────────────────────────────────────
    # 23+23+23 violations - TODO comments are tracked in the issue backlog.
    "TD002",   # missing-todo-author - not required in this project
    "TD003",   # missing-todo-link - not required in this project
    "FIX002",  # line-contains-todo - tracked in backlog

    # ── N806: Uppercase variable names ────────────────────────────────────────
    # 24 violations - ML/AI convention uses uppercase for constants (e.g. X, Y).
    "N806",    # non-lowercase-variable-in-function - ML convention (X, Y)

    # ── INP001: Implicit namespace package ───────────────────────────────────
    # 24 violations - intentional namespace packages without __init__.py.
    "INP001",  # implicit-namespace-package - intentional

    # ── RUF001: Ambiguous unicode string ─────────────────────────────────────
    # 14 violations - legitimate Unicode in user-facing strings and TTS output.
    "RUF001",  # ambiguous-unicode-character-string - legitimate unicode

    # ── PYI036: Bad annotations in __exit__ ──────────────────────────────────
    "PYI036",  # bad-exit-annotation - legacy pattern

    # ── NPY002: Legacy numpy random ──────────────────────────────────────────
    # 12 violations - random number generation in ML models uses the legacy API
    # for reproducibility with fixed seeds in existing trained models.
    "NPY002",  # numpy-legacy-random - reproducibility requirement

    # ── PTH: Use pathlib ─────────────────────────────────────────────────────
    # 10+6+4+4+3+2+1+1+1 violations - os.path used in legacy code alongside
    # pathlib. Fix incrementally when touching those files.
    "PTH100",  # os-path-abspath - legacy
    "PTH108",  # os-unlink - legacy
    "PTH110",  # os-path-exists - legacy
    "PTH118",  # os-path-join - legacy
    "PTH120",  # os-path-dirname - legacy
    "PTH123",  # open-builtin-with-mode - legacy
    "PTH202",  # os-path-getsize - legacy

    # ── PLR2004: Magic values ─────────────────────────────────────────────────
    # 17 violations - numeric literals in ML code are domain constants
    # (e.g. 0.5 threshold, 16000 sample rate). Extracting to named constants
    # would reduce readability in mathematical expressions.
    "PLR2004", # magic-value-comparison - ML domain constants

    # ── PLW2901: Overwriting loop variable ────────────────────────────────────
    "PLW2901", # redefined-loop-name - intentional pattern

    # ── DTZ: Timezone-naive datetime ─────────────────────────────────────────
    # 6+3+2 violations - audit timestamps use UTC explicitly; some legacy
    # code uses datetime.now() which is being migrated incrementally.
    "DTZ004",  # call-datetime-fromtimestamp - legacy, fix incrementally
    "DTZ005",  # call-datetime-now - legacy, fix incrementally
    "DTZ006",  # call-datetime-utcfromtimestamp - legacy, fix incrementally

    # ── PGH003: Broad type ignore ────────────────────────────────────────────
    # 7 violations - intentional type: ignore[assignment] for dynamic adapters.
    "PGH003",  # blanket-type-ignore - intentional for dynamic adapters

    # ── SIM103: Return boolean expression ────────────────────────────────────
    "SIM103",  # return-in-try-except-else - readability

    # ── A: shadowing builtins ─────────────────────────────────────────────────
    "A001",    # builtin-variable-shadowing - legacy parameter names
    "A002",    # builtin-argument-shadowing - legacy parameter names (e.g. input, type)
    "A004",    # builtin-import-shadowing - intentional in compatibility shims

    # ── S: Security ───────────────────────────────────────────────────────────
    # Flagged items that are safe in context or already have nosec comments.
    "S110",    # try-except-pass - intentional guard clause
    "S112",    # try-except-continue - intentional guard clause
    "S311",    # suspicious-non-cryptographic-random-usage - ML non-crypto use
    "S314",    # suspicious-xml-element-tree - safe, no untrusted input
    "S310",    # suspicious-url-open - HTTP within own infrastructure
    "S602",    # subprocess-popen-with-shell-equals-true - guarded by nosec
    "S606",    # start-process-no-shell - guarded by nosec
    "S607",    # start-process-with-partial-path - guarded by nosec

    # ── EM102: Exception with f-string ────────────────────────────────────────
    "EM102",   # f-string-in-exception - readability preferred over variable

    # ── LOG015: logging.exception in except ───────────────────────────────────
    "LOG015",  # root-logger-call - structlog used exclusively in new code

    # ── ASYNC110 / PLW0602 / PERF402 / N818 / PIE796 / ICN001 ─────────────────
    "PLW0602", # global-variable-not-assigned - intentional sentinel
    "N818",    # exception-name - legacy naming
    "PIE796",  # duplicate-union-member - false positive in complex generics
    "ICN001",  # unconventional-import-alias - deliberate alias for long names
]

[tool.ruff.lint.per-file-ignores]
# Test files - relax strictness for helpers and fixtures
"**/tests/**" = ["D", "BLE001", "FBT001", "FBT002", "FBT003"]
"**/test_*.py" = ["D", "BLE001", "FBT001", "FBT002", "FBT003"]
# Scripts - standalone profiling/cleanup tools
"**/scripts/**" = ["D102", "D103", "FBT001", "FBT002"]
# Examples - demonstration code, not production API
"**/examples/**" = ["D102", "D103", "FBT001", "FBT002", "FBT003"]
# Benchmarks - boolean flags are common and expected
"**/benchmarks/**" = ["FBT001", "FBT002", "FBT003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "spacy.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["Agent_Guru/reasoning"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["*/tests/*", "*/test_*", "htmlcov"]
skips = ["B101", "B108"]  # B101: assert_used (valid in tests); B108: hardcoded_tmp (acceptable in tests)

[tool.pyrefly]
search_path = [".", "stubs"]
