# AGENT_GURU Prometheus Configuration
# Enterprise-grade metrics collection with comprehensive monitoring
# Zero-tolerance observability standards with maximum visibility

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agent-guru'
    environment: 'production'

# Rule files for alerting
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # ========================================================================
  # PROMETHEUS SELF-MONITORING
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # ========================================================================
  # AGENT_GURU APPLICATION METRICS
  # ========================================================================
  - job_name: 'agent-guru'
    static_configs:
      - targets: ['agent-guru:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # ========================================================================
  # SYSTEM METRICS - Node Exporter
  # ========================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # ========================================================================
  # DATABASE METRICS - PostgreSQL
  # ========================================================================
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: /metrics

  # ========================================================================
  # CACHE METRICS - Redis
  # ========================================================================
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # ========================================================================
  # CONTAINER METRICS - cAdvisor
  # ========================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # ========================================================================
  # APPLICATION PERFORMANCE MONITORING
  # ========================================================================
  - job_name: 'agent-guru-performance'
    static_configs:
      - targets: ['agent-guru:8080']
    scrape_interval: 5s
    metrics_path: /metrics/performance
    scrape_timeout: 5s
    params:
      detailed: ['true']

  # ========================================================================
  # SECURITY METRICS
  # ========================================================================
  - job_name: 'agent-guru-security'
    static_configs:
      - targets: ['agent-guru:8080']
    scrape_interval: 60s
    metrics_path: /metrics/security
    scrape_timeout: 10s

  # ========================================================================
  # BUSINESS METRICS
  # ========================================================================
  - job_name: 'agent-guru-business'
    static_configs:
      - targets: ['agent-guru:8080']
    scrape_interval: 30s
    metrics_path: /metrics/business
    scrape_timeout: 10s

# ============================================================================
# ALERTING CONFIGURATION
# ============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# ============================================================================
# REMOTE WRITE CONFIGURATION (for long-term storage)
# ============================================================================
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 10000
      max_shards: 200
      capacity: 20000
    metadata_config:
      send: true
      send_interval: 30s
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

# ============================================================================
# STORAGE CONFIGURATION
# ============================================================================
storage:
  tsdb:
    retention.time: 30d
    retention.size: 50GB
    wal-compression: true