# AGENT_GURU Grafana Datasource Configuration
# Enterprise-grade visualization with comprehensive data sources

apiVersion: 1

datasources:
  # ========================================================================
  # PROMETHEUS - Primary metrics datasource
  # ========================================================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
      manageAlerts: true
      prometheusType: "Prometheus"
      prometheusVersion: "2.40.0"
      cacheLevel: "High"
      incrementalQuerying: true
      incrementalQueryOverlapWindow: "10m"
      disableRecordingRules: false
      customQueryParameters: ""
      exemplarTraceIdDestinations:
        - name: "trace_id"
          datasourceUid: "jaeger"

  # ========================================================================
  # LOKI - Log aggregation datasource
  # ========================================================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: "jaeger"
          matcherRegex: "trace_id=(\\w+)"
          name: "TraceID"
          url: "$${__value.raw}"

  # ========================================================================
  # JAEGER - Distributed tracing datasource
  # ========================================================================
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["job", "instance", "pod", "namespace"]
        mappedTags: [{"key": "service.name", "value": "service"}]
        mapTagNamesEnabled: false
        spanStartTimeShift: "1h"
        spanEndTimeShift: "1h"
        filterByTraceID: false
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: "prometheus"
        tags: [{"key": "service.name", "value": "service"}, {"key": "job"}]
        queries:
          - name: "Sample query"
            query: "sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m]))"
      nodeGraph:
        enabled: true

  # ========================================================================
  # POSTGRES - Database metrics datasource
  # ========================================================================
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: agent_guru
    user: grafana_reader
    secureJsonData:
      password: "${POSTGRES_GRAFANA_PASSWORD}"
    jsonData:
      sslmode: "require"
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false

  # ========================================================================
  # REDIS - Cache metrics datasource
  # ========================================================================
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis://redis:6379
    jsonData:
      client: "standalone"
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0

  # ========================================================================
  # TESTDATA - For testing and development
  # ========================================================================
  - name: TestData
    type: testdata
    access: proxy
    isDefault: false
    editable: true