# Staging environment values
global:
  environment: staging
  logLevel: DEBUG

image:
  tag: "main"
  pullPolicy: Always

replicaCount: 2

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: staging.agent-guru.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agent-guru-staging-tls-cert
      hosts:
        - staging.agent-guru.ai

podDisruptionBudget:
  enabled: false

env:
  - name: ENVIRONMENT
    value: "staging"
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: PYTHONUNBUFFERED
    value: "1"

config:
  data:
    config.yaml: |
      environment: staging
      log_level: DEBUG
      latency_budgets:
        input_normalization: 50
        intent_detection: 300
        reasoning: 500
        tool_selection: 100
        safety_validation: 50
        execution: 300
        response_generation: 150
      max_reasoning_steps: 5
      enable_async_execution: true
      enable_caching: true
      cache_ttl: 300
