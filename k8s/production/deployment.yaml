apiVersion: v1
kind: Namespace
metadata:
  name: agent-guru-production
  labels:
    environment: production
    app: agent-guru

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-guru-reasoning
  namespace: agent-guru-production
  labels:
    app: agent-guru-reasoning
    environment: production
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-guru-reasoning
  template:
    metadata:
      labels:
        app: agent-guru-reasoning
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agent-guru-reasoning
              topologyKey: kubernetes.io/hostname
      containers:
      - name: reasoning
        image: ghcr.io/agent-guru/agent-guru:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: agent-guru-secrets
              key: sentry-dsn
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-guru-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-guru-secrets
              key: anthropic-api-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: agent-guru-config
      imagePullSecrets:
      - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: agent-guru-reasoning
  namespace: agent-guru-production
  labels:
    app: agent-guru-reasoning
    environment: production
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: agent-guru-reasoning
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-guru-config
  namespace: agent-guru-production
data:
  config.yaml: |
    environment: production
    log_level: INFO
    latency_budgets:
      input_normalization: 30
      intent_detection: 200
      reasoning: 400
      tool_selection: 50
      safety_validation: 30
      execution: 300
      response_generation: 150
    max_reasoning_steps: 5
    enable_async_execution: true
    enable_caching: true
    cache_ttl: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-guru-reasoning-hpa
  namespace: agent-guru-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-guru-reasoning
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-guru-reasoning-pdb
  namespace: agent-guru-production
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: agent-guru-reasoning
