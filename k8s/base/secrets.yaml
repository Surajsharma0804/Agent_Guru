# Secrets template - actual values should be managed via sealed-secrets or external secrets operator
# This file shows the structure only - DO NOT commit actual secrets to git

apiVersion: v1
kind: Secret
metadata:
  name: agent-guru-secrets
type: Opaque
stringData:
  # LLM API Keys (base64 encoded in actual deployment)
  openai-api-key: "REPLACE_WITH_ACTUAL_KEY"
  anthropic-api-key: "REPLACE_WITH_ACTUAL_KEY"
  google-api-key: "REPLACE_WITH_ACTUAL_KEY"
  
  # Monitoring
  sentry-dsn: "REPLACE_WITH_ACTUAL_DSN"
  
  # Database
  postgres-password: "REPLACE_WITH_ACTUAL_PASSWORD"
  redis-password: "REPLACE_WITH_ACTUAL_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG
