apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollback-monitor
  namespace: agent-guru-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollback-monitor
  namespace: agent-guru-production
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollback-monitor
  namespace: agent-guru-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollback-monitor
subjects:
- kind: ServiceAccount
  name: rollback-monitor
  namespace: agent-guru-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rollback-monitor-config
  namespace: agent-guru-production
data:
  HEALTH_CHECK_URL: "https://agent-guru.example.com/health"
  PROMETHEUS_URL: "http://prometheus:9090"
  KUBERNETES_NAMESPACE: "agent-guru-production"
  SERVICE_NAME: "agent-guru-reasoning"
  ERROR_RATE_THRESHOLD: "5.0"
  LATENCY_BASELINE_P95: "1500.0"
  LATENCY_DEGRADATION_MULTIPLIER: "2.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-monitor
  namespace: agent-guru-production
  labels:
    app: rollback-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollback-monitor
  template:
    metadata:
      labels:
        app: rollback-monitor
    spec:
      serviceAccountName: rollback-monitor
      containers:
      - name: monitor
        image: ghcr.io/agent-guru/rollback-monitor:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: rollback-monitor-config
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: rollback-monitor-secrets
              key: slack-webhook-url
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: rollback-monitor-secrets
  namespace: agent-guru-production
type: Opaque
stringData:
  slack-webhook-url: ""  # Set via kubectl or CI/CD
