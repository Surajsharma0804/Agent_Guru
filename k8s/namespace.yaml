# AGENT_GURU Kubernetes Namespace Configuration
# Enterprise-grade namespace with security policies and resource quotas

apiVersion: v1
kind: Namespace
metadata:
  name: agent-guru
  labels:
    name: agent-guru
    environment: production
    app.kubernetes.io/name: agent-guru
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: agent-guru-platform
    app.kubernetes.io/managed-by: kubernetes
  annotations:
    description: "AGENT_GURU Sovereign AI Operating Companion"
    contact: "platform-team@agent-guru.com"
    security.policy: "restricted"
    network.policy: "enabled"

---
# Resource Quota for the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-guru-quota
  namespace: agent-guru
  labels:
    app.kubernetes.io/name: agent-guru
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    # Compute resources
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    
    # Storage resources
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    
    # Object counts
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "30"
    replicationcontrollers: "10"
    deployments.apps: "20"
    statefulsets.apps: "10"
    jobs.batch: "20"
    cronjobs.batch: "10"

---
# Limit Range for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-guru-limits
  namespace: agent-guru
  labels:
    app.kubernetes.io/name: agent-guru
    app.kubernetes.io/component: limit-range
spec:
  limits:
    # Default limits for containers
    - default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 1Gi
      type: Container
    
    # Limits for pods
    - max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 10Gi
      min:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 100Mi
      type: Pod
    
    # Limits for persistent volume claims
    - max:
        storage: 50Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim

---
# Network Policy for security isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-guru-network-policy
  namespace: agent-guru
  labels:
    app.kubernetes.io/name: agent-guru
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow ingress from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    
    # Allow ingress from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    
    # Allow inter-pod communication within namespace
    - from:
        - podSelector: {}
  
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow HTTPS to external services
    - to: []
      ports:
        - protocol: TCP
          port: 443
    
    # Allow communication to database
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow communication to cache
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# Pod Security Policy (if PSP is enabled)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: agent-guru-psp
  namespace: agent-guru
  labels:
    app.kubernetes.io/name: agent-guru
    app.kubernetes.io/component: pod-security-policy
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault