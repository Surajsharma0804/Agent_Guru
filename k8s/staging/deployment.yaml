apiVersion: v1
kind: Namespace
metadata:
  name: agent-guru-staging
  labels:
    environment: staging
    app: agent-guru

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-guru-reasoning
  namespace: agent-guru-staging
  labels:
    app: agent-guru-reasoning
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-guru-reasoning
  template:
    metadata:
      labels:
        app: agent-guru-reasoning
        environment: staging
    spec:
      containers:
      - name: reasoning
        image: ghcr.io/agent-guru/agent-guru:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: agent-guru-config
      imagePullSecrets:
      - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: agent-guru-reasoning
  namespace: agent-guru-staging
  labels:
    app: agent-guru-reasoning
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: agent-guru-reasoning

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-guru-config
  namespace: agent-guru-staging
data:
  config.yaml: |
    environment: staging
    log_level: DEBUG
    latency_budgets:
      input_normalization: 50
      intent_detection: 300
      reasoning: 500
      tool_selection: 100
      safety_validation: 50
      execution: 300
      response_generation: 150
    max_reasoning_steps: 5
    enable_async_execution: true

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-guru-reasoning-hpa
  namespace: agent-guru-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-guru-reasoning
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
