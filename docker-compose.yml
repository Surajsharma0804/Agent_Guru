# docker-compose.yml - Agent Guru backend services
# Run with: docker-compose up -d
# The voice assistant (main.py) runs on the HOST so it can access mic/screen/speakers.
# This file starts the backend services it connects to.

services:
  reasoning-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-guru-reasoning-dev
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=DEBUG
      # LLM API keys - set in .env or CI secrets (never hardcode)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Database connections
      - DATABASE_URL=${DATABASE_URL:-postgresql://agent_guru:${POSTGRES_PASSWORD}@postgres:5432/agent_guru}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      # Ollama (local LLM) - points to the ollama service in this compose stack
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # App settings
      - AGENT_GURU_ENV=${AGENT_GURU_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env or environment}
      # Log directory (persisted via volume mount below)
      - AGENT_GURU_LOG_DIR=/app/logs
    ports:
      - "8000:8000"
      - "9090:9090"  # Prometheus metrics
    volumes:
      # Mount source code for hot reload
      - ./Agent_Guru:/app/Agent_Guru
      # Preserve Python cache
      - python-cache:/root/.cache/pip
      # Persisted log directory
      - ./logs:/app/logs
    command: >
      sh -c "
        echo 'Starting development environment with hot reload...' &&
        python -m pytest --cov -v -s
      "
    stdin_open: true
    tty: true

  # ----------------------------------------------------------------
  # Ollama - local LLM backend (GPU-accelerated when available)
  # ----------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: agent-guru-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for NVIDIA GPU support (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: agent-guru-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  postgres:
    image: postgres:16-alpine
    container_name: agent-guru-postgres
    environment:
      POSTGRES_DB: agent_guru
      POSTGRES_USER: agent_guru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  python-cache:
  redis-data:
  postgres-data:
  ollama-models:
