[pytest]
# Pytest configuration for Agent Guru

# Test discovery
testpaths = Agent_Guru/reasoning/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider
    --hypothesis-show-statistics

# Markers for test organization
markers =
    unit: Unit tests for individual components
    property: Property-based tests using Hypothesis
    integration: Integration tests for component interactions
    slow: Tests that take >1s to run
    performance: Performance benchmark tests
    gpu: Tests requiring GPU acceleration
    concurrency: Concurrency and thread-safety tests
    stress: Stress tests with high load
    security: Security-focused tests

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = Agent_Guru
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Hypothesis configuration
[hypothesis]
max_examples = 100
derandomize = True
deadline = None
print_blob = False
database = none
