[pytest]
testpaths = Agent_Guru/reasoning/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    property: Property-based tests using Hypothesis
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

addopts =
    --strict-markers
    --verbose
    --tb=short
    --cov=Agent_Guru/reasoning
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

[coverage:run]
source = Agent_Guru/reasoning
omit =
    */tests/*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[hypothesis]
max_examples = 100
derandomize = false
print_blob = true

[hypothesis:ci]
max_examples = 100
derandomize = true
