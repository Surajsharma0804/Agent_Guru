[pytest]
# Pytest configuration for Agent Guru

# Test discovery
testpaths = 
    Agent_Guru
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
    --hypothesis-show-statistics
    --timeout=30
    -m "not real_tts and not long_stress"

# Global test timeout - no test may run longer than 30 seconds.
# No test reaches a real model by default: the root conftest refuses the
# Ollama port. Tests that need one are marked @pytest.mark.live_llm and run
# with AGENT_GURU_LIVE_LLM=1.
timeout = 30

# Markers for test organization
#
# real_tts tests synthesise speech with the real Kokoro model hundreds or
# thousands of times. Measured on a laptop CPU, one of them took 35 to 45
# minutes, far past any per-test timeout, and on Windows pytest-timeout ends
# the whole run on the first overrun, so they kept the rest of the suite from
# ever finishing. addopts deselects them with -m "not real_tts"; the scheduled
# CI job runs them with `pytest -m real_tts`, and the last -m given wins.
#
# long_stress is the same treatment for a test that is slow without touching
# the TTS model: test_voice_cloner_extreme_memory_stress_10000_features runs
# 10,000 spectrogram extractions and took 556 s alone on the development
# laptop, most of the default run's time in one test. It is kept separate from
# real_tts so that marker keeps meaning what it says. The scheduled job runs
# both with -m "real_tts or long_stress".
markers =
    unit: Unit tests for individual components
    property: Property-based tests using Hypothesis
    integration: Integration tests for component interactions
    slow: Tests that take >1s to run
    performance: Performance benchmark tests
    gpu: Tests requiring GPU acceleration
    concurrency: Concurrency and thread-safety tests
    stress: Stress tests with high load
    security: Security-focused tests
    hardest: Hardest-case tests for the most demanding scenarios
    adversarial: Adversarial robustness tests
    hypothesis: Hypothesis-driven property tests
    real_tts: Runs the real Kokoro TTS model many times; excluded by default, run on a schedule with -m real_tts
    long_stress: Runs for many minutes without the TTS model; excluded by default, run on the same schedule
    live_llm: Needs a real model through Ollama; skipped unless AGENT_GURU_LIVE_LLM=1

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage configuration
[coverage:run]
source = Agent_Guru
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Hypothesis configuration
[hypothesis]
max_examples = 100
derandomize = True
deadline = None
print_blob = False
database = none
