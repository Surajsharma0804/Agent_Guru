[package]
name = "agent_guru"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["AGENT_GURU Development Team"]
description = "Production-grade sovereign AI operating companion with cryptographic governance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agent-guru/agent-guru"
documentation = "https://docs.rs/agent_guru"
readme = "README.md"
keywords = ["ai", "cryptography", "security", "voice", "biometrics"]
categories = ["cryptography", "authentication", "multimedia", "science"]

[dependencies]
# Enhanced cryptographic dependencies
rand = { version = "0.8", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
subtle = "2.5"
sha2 = "0.10"

# Formally verified cryptographic libraries
ed25519-dalek = { version = "2.1", features = ["batch", "zeroize"] }
curve25519-dalek = { version = "4.1", features = ["simd_backend"] }
x25519-dalek = "2.0"

# Additional cryptographic primitives
blake3 = "1.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Additional dependencies for speech recognition
fastrand = "2.0"

# Performance and hardware detection
cpufeatures = "0.2"

[dev-dependencies]
# Property-based testing
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Testing utilities
tempfile = "3.8"
assert_matches = "1.5"

[lib]
name = "agent_guru"
path = "guru/lib.rs"

[[bin]]
name = "agent_guru"
path = "guru/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true
overflow-checks = true

# Formal verification and security
[features]
default = ["std"]
std = []
formal-verification = []
security-audit = []
performance-profiling = []

# Platform-specific features
windows = []
macos = []
linux = []

# Component features
cryptography = []
voice-processing = []
biometrics = []
vision = []
intelligence = []
avatars = []

[workspace]
# No workspace members for now - single crate project

[workspace.dependencies]
# Shared dependencies across workspace
rand = "0.8"
serde = "1.0"
tokio = "1.0"
tracing = "0.1"