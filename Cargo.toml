[package]
name = "agent_guru"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["AGENT_GURU Development Team"]
description = "Production-grade sovereign AI operating companion with cryptographic governance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agent-guru/agent-guru"
documentation = "https://docs.rs/agent_guru"
readme = "README.md"
keywords = ["ai", "cryptography", "security", "voice", "biometrics"]
categories = ["cryptography", "authentication", "multimedia", "science"]

[dependencies]
# Enhanced cryptographic dependencies
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
subtle = "2.5"
sha2 = "0.10"

# Formally verified cryptographic libraries
ed25519-dalek = { version = "2.1", features = ["batch", "zeroize"] }
curve25519-dalek = "4.1"
x25519-dalek = "2.0"

# Additional cryptographic primitives
blake3 = "1.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
password-hash = "0.5"
pbkdf2 = "0.12"
scrypt = "0.11"
base64 = "0.22"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Parallel processing
rayon = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for LLM integration
reqwest = { version = "0.11", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Additional dependencies for speech recognition and avatar systems
fastrand = "2.0"

# Performance and hardware detection
cpufeatures = "0.2"

# LRU cache for policy engine
lru = "0.12"

# Regular expressions for logging sanitization
regex = "1.10"

# Biometric processing dependencies
image = "0.24"
imageproc = "0.23"
nalgebra = "0.32"
ndarray = "0.15"

# Audio processing for voice biometrics
hound = "3.5"
rustfft = "6.1"
apodize = "1.0"

# Real-time audio I/O
cpal = "0.15"
rodio = "0.17"

# Speech recognition - Whisper.cpp bindings (optional - requires LLVM/Clang)
whisper-rs = { version = "0.12", optional = true }

# Additional serialization
bincode = "1.3"

[dev-dependencies]
# Property-based testing
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Testing utilities
tempfile = "3.8"
assert_matches = "1.5"

[lib]
name = "agent_guru"
path = "guru/lib.rs"

[[bin]]
name = "agent_guru"
path = "guru/main.rs"

[[bin]]
name = "agent_guru_voice"
path = "guru/voice_main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true
overflow-checks = true

# Formal verification and security
[features]
default = ["std"]
std = []
formal-verification = []
security-audit = []
performance-profiling = []

# Test profile features for smart configuration
ci-testing = []
production-testing = []
stress-testing = []

# Platform-specific features
windows = []
macos = []
linux = []

# Component features
cryptography = []
voice-processing = []
biometrics = []
vision = []
intelligence = []
avatars = []
whisper = ["whisper-rs"]

[workspace]
members = [
    "."
]

[workspace.dependencies]
# Shared dependencies across workspace
rand = "0.8"
serde = "1.0"
tokio = "1.0"
tracing = "0.1"