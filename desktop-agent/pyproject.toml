[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guru-desktop-agent"
version = "1.0.0"
description = "GURU Personal Assistant - Production-Grade Desktop Agent with Security-First Design"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "GURU Development Team", email = "dev@guru-assistant.local"}
]
keywords = [
    "personal-assistant",
    "voice-control",
    "automation",
    "security",
    "privacy",
    "biometric-authentication",
    "local-first",
    "windows",
    "cryptography",
    "audit-logging"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed"
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=41.0.8",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "argon2-cffi>=23.1.0",
    "pywin32>=306",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "psutil>=5.9.6",
    "numpy>=1.25.2",
    "scipy>=1.11.4",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.1",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.1.0",
    "pyzbar>=0.1.9",
    "python-dateutil>=2.8.2",
    "click>=8.1.7",
    "rich>=13.7.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.1",
    "factory-boy>=3.3.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "safety>=2.3.5",
    "types-requests>=2.31.0.10",
    "types-python-dateutil>=2.8.19.14"
]

voice = [
    "whisper-cpp-python>=0.1.0",
    "piper-tts>=1.2.0",
    "pyaudio>=0.2.11"
]

multilingual = [
    "fasttext>=0.9.2",
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numba>=0.58.0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/your-org/guru-personal-assistant"
Documentation = "https://github.com/your-org/guru-personal-assistant#readme"
Repository = "https://github.com/your-org/guru-personal-assistant.git"
Issues = "https://github.com/your-org/guru-personal-assistant/issues"

[project.scripts]
guru-desktop = "src.main:main"
guru-desktop-cli = "src.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-fail-under=85",
    "--hypothesis-show-statistics"
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests across components",
    "security: Security-focused tests",
    "properties: Property-based tests using Hypothesis",
    "negative: Negative tests for error conditions",
    "slow: Tests that take longer to run",
    "concurrent: Tests involving concurrency"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning:hypothesis.*",
    "ignore::PendingDeprecationWarning"
]
minversion = "7.0"
timeout = 300

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/venv/*", "*/env/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = false
disallow_any_unimported = false
ignore_missing_imports = true
implicit_reexport = false
strict_optional = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg"
]
max-complexity = 15
per-file-ignores = [
    "__init__.py:F401"
]
