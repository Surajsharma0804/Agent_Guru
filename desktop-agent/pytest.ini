[tool:pytest]
# GURU Desktop Agent Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --cov-fail-under=85
    --hypothesis-show-statistics

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    security: Security-focused tests
    properties: Property-based tests using Hypothesis
    negative: Negative tests for error conditions
    slow: Tests that take longer to run
    concurrent: Tests involving concurrency

# Test filtering
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:hypothesis.*
    ignore::PendingDeprecationWarning

# Minimum versions
minversion = 7.0

# Hypothesis configuration
hypothesis_profile = default

# Timeout for tests (in seconds)
timeout = 300

# Parallel execution
# addopts = -n auto  # Uncomment to enable pytest-xdist

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod