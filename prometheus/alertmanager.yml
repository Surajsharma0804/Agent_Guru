# Alertmanager configuration for Agent Guru
global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  # Default receiver
  receiver: 'team-notifications'
  
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']
  
  # Wait time before sending initial notification
  group_wait: 30s
  
  # Wait time before sending notification about new alerts in group
  group_interval: 5m
  
  # Wait time before re-sending notification
  repeat_interval: 4h
  
  # Child routes
  routes:
    # Critical alerts go to PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    
    # Critical alerts also go to Slack
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: false
      group_wait: 10s
      group_interval: 1m
    
    # Warning alerts go to Slack only
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h
    
    # Business metrics alerts
    - match:
        component: reasoning_engine
      receiver: 'slack-business-metrics'
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h

# Inhibition rules (suppress alerts)
inhibit_rules:
  # Suppress warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
  
  # Suppress high latency if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(HighP95Latency|HighP99Latency|HighErrorRate)'
    equal: ['instance']
  
  # Suppress degraded mode alerts if LLM is unavailable
  - source_match:
      alertname: 'LLMUnavailable'
    target_match:
      alertname: 'HighDegradedModeRate'
    equal: ['instance']

# Receivers configuration
receivers:
  # Default team notifications (email)
  - name: 'team-notifications'
    email_configs:
      - to: 'team@agent-guru.com'
        from: 'alerts@agent-guru.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: '${SMTP_USERNAME}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .CommonAnnotations.runbook_url }}">{{ .CommonAnnotations.runbook_url }}</a></p>
          <p><strong>Firing Alerts:</strong></p>
          <ul>
          {{ range .Alerts }}
            <li>{{ .Labels.instance }}: {{ .Annotations.description }}</li>
          {{ end }}
          </ul>
  
  # PagerDuty for critical alerts
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: 'critical'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          alertname: '{{ .GroupLabels.alertname }}'
          cluster: '{{ .GroupLabels.cluster }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook_url: '{{ .CommonAnnotations.runbook_url }}'
  
  # Slack for critical alerts
  - name: 'slack-critical'
    slack_configs:
      - channel: '#alerts-critical'
        username: 'AlertManager'
        icon_emoji: ':fire:'
        title: ':fire: Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook_url }}
          
          *Firing Alerts ({{ .Alerts.Firing | len }}):*
          {{ range .Alerts.Firing }}
          • {{ .Labels.instance }}: {{ .Annotations.description }}
          {{ end }}
        color: 'danger'
        send_resolved: true
  
  # Slack for warning alerts
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#alerts-warnings'
        username: 'AlertManager'
        icon_emoji: ':warning:'
        title: ':warning: Warning: {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook_url }}
          
          *Firing Alerts ({{ .Alerts.Firing | len }}):*
          {{ range .Alerts.Firing }}
          • {{ .Labels.instance }}: {{ .Annotations.description }}
          {{ end }}
        color: 'warning'
        send_resolved: true
  
  # Slack for business metrics
  - name: 'slack-business-metrics'
    slack_configs:
      - channel: '#metrics-business'
        username: 'AlertManager'
        icon_emoji: ':chart_with_upwards_trend:'
        title: ':chart_with_upwards_trend: Business Metric Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          
          *Affected Instances:*
          {{ range .Alerts.Firing }}
          • {{ .Labels.instance }}
          {{ end }}
        color: 'good'
        send_resolved: true
