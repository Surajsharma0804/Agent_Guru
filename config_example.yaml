# GuruVision Configuration Example (YAML format)

# Model paths
onnx_model_path: guru_face/model/guru_face_model.onnx
database_path: guru_face/database/identities.json
liveness_model_path: null
emotion_model_path: null

# Recognition settings
recognition_threshold: 0.6  # Range: 0.4 to 0.9
detection_confidence: 0.5   # Range: 0.0 to 1.0

# Performance settings
use_gpu: true
target_fps: 10

# Feature toggles
enable_liveness: true
enable_emotion: true
enable_tracking: true
enable_low_light_enhancement: true

# Tracking settings
tracker_algorithm: deepsort  # Options: deepsort, bytetrack
tracker_max_age: 30          # frames

# Logging settings
log_level: INFO              # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: guru_face/logs/guruvision.log
log_max_size_mb: 100

# Camera settings
camera_index: 0
video_source: null           # Set to video file path, or null for webcam
